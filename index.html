<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"KaiTi","SimSun",serif;}
body{background:#f7f5ee;color:#443322;padding:24px;}

.header-title{text-align:center;margin-bottom:24px;}

.sub-title{color:#776655;margin-top:6px;font-size:16px;letter-spacing:1px;}

.tab-item:not(.active){background:#fffaf0;}

select{padding:10px 12px;border:1px solid #c9b8a4;border-radius:8px;font-size:16px;background:#fff;min-width:260px;}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;}
button{padding:10px 18px;border:1px solid #b8a894;border-radius:8px;background:#fffaf0;font-size:15px;cursor:pointer;transition:0.2s;}
button:hover{background:#ede3d6;}
button.primary{background:#e6d9c8;border-color:#8b7763;}

.card-box{background:#fffaf0;border:1px solid #ddccb8;border-radius:12px;padding:32px;min-height:340px;}

.opt{padding:14px 16px;border:1px solid #e2d4c2;border-radius:10px;margin-bottom:12px;cursor:pointer;font-size:17px;transition:0.2s;}
.opt:hover{background:#f6ede0;}
.opt.right{border-color:#549667;background:#edf7ef;}
.opt.wrong{border-color:#c85454;background:#fceeee;}
.opt-exp{margin-top:8px;font-size:14px;color:#555;display:none;line-height:1.6;}
.opt.show-exp .opt-exp{display:block;}
.bottom-btn-row{margin-top:32px;display:flex;gap:12px;}

.mingyan-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:998;display:none;}
.mingyan-overlay.show{display:block;}
.mingyan-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fffaf0;border:2px solid #c9b396;padding:30px 36px;border-radius:14px;z-index:999;max-width:460px;display:none;box-shadow:0 4px 24px #00000022;}

.mingyan-author{text-align:right;margin-top:16px;color:#886644;font-size:17px;}

.stat-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fffaf0;border:2px solid #c9b396;padding:28px;border-radius:14px;z-index:999;display:none;min-width:360px;}

.stat-title{font-size:20px;text-align:center;margin-bottom:16px;color:#503828;}
.stat-line{margin:10px 0;font-size:16px;}

.empty-tip{text-align:center;padding:80px 0;color:#948474;font-size:18px;}

const catalog = [{"title": "第1课 中华文明的起源与早期国家", "body": "一、从原始社会到早期国家产生\n时间 距今约 1 万年以前 约 7000—5000 年前 距今约 5000 年\n人类文化遗存 元谋人、北京人等 仰韶文化、河姆渡\n文化等\n龙山文化、红山文化、\n良渚文化等\n生产力 生产工具 打制石器（旧石器时\n代）\n打磨结合制作石器（新石器时代）\n生产方式 采集渔猎 原始农业、畜牧业产生并发展\n生产关\n系\n生活方式 穴（巢）居；迁徙 筑屋；定居，村落形成\n社会关系 原始人群\n母系氏族公社：生\n产力水平低；共同\n劳动成果共享；公\n有制\n父系氏族公社：贫富分\n化、私有制；阶级分化；\n部落联盟向国家过渡；\n国家出现\n中华文明起源的特点 ①源远流长；②多源性、本土性；③生产力发展是根本推动力；④\n呈现出多元一体、中原核心的发展方向。\n二、夏、商、西周（BC2070-BC771：早期国家）阶段特征\n1 商朝：约公元前 1600 年，汤建立商朝。文化：甲骨文。政治：内外服制。经济：青铜\n器造型雄伟。\n2 西周：\n（1）公元前 1046 年，周武王建立西周，定都镐京。\n（2）政治：实行分封制与宗法制。\n\n（3）分封制：\n①含义：周王将王畿之外的地区，分封给王族，功臣和前朝贵族，在地方建立世袭的诸侯\n国。\n②目的：“封建亲戚，以藩屏周” 分封对象以同姓亲族为主体，等级森严，层层分封。\n③诸侯义务：朝觐，随王出征，交纳贡赋，镇守疆土。\n④诸侯权力：世袭统治权，建立军队，设置官员，征收赋税，再分封。\n⑤评价：形成了天子-诸侯-卿大夫-士的金字塔型等级结构，加强了周天子对地方的统治。\n传播了中原先进文化，开发了边远地区，但诸侯在自己封地享有相当大的独立性，容易造\n成分裂割据。\n（4） 宗法制 ：\n①含义：父系血缘关系，维系政治等级，巩固国家统治\n②基本原则：嫡长子继承制\n③内容：大宗、小宗体系；相对性；周天子是天下大宗和最高领袖\n④特点：政治关系和血缘关系相结合；家国一体和家国同构。\n3 商和西周的社会经济：（1）实行井田制，是奴隶主土地国有制，井田名义上归周王所\n有，分配给臣下使用，土地不能随意买卖。（2）农业生产主要使用木，石等工具，青铜农\n具极少。（3）青铜铸造业发达"}, {"title": "第2课 诸侯纷争与变法运动", "body": "一、春秋战国（BC770-BC221）阶段特征（社会转型）\n总特征 大变革、大转型，从奴隶社会向封建社会转型\n经济 铁器牛耕使用，生产力飞跃；井田制逐步瓦解，封建土地私有制确立；小农经济\n出现并发展，重农抑商政策开始出现\n\n政治\n周王室衰微，宗法分封制遭破坏，诸侯争霸，为求富国强兵，各国变法；分封制\n逐渐崩溃，开始出现县制，形成中央集权的雏形；国家由分裂走向统一；由奴隶\n制贵族政治向封建的官僚政治演变\n思想 礼乐制度崩溃，私学兴起，百家争鸣，是中国历史上第一次思想解放潮流\n阶级 奴隶主贵族衰落，地主阶级日益壮大，士阶层兴起；\n民族 民族交融，华夏认同观念扩展至周边民族，华夏族发展壮大；\n军事 大国在争霸战争中相互兼并，实现了区域性的局部统一，加快了全国统一的步伐\n二、百家争鸣\n1 孔子思想：\n（1）背景：礼崩乐坏，社会动荡。\n（2）内容：孔子的思想核心是仁。主张统治者顺应民心，爱惜民力。为政以德，主张恢复\n西周等级森严的礼乐制度。以有教无类的思想办学，打破了贵族垄断文化教育的局面。\n2 老子思想：将天地万物的本原归结为道。 追求天人合一。揭示出事物存在着相互依存，\n相互转化，对立统一的矛盾。主张顺其自然，无为而治，退回到小国寡民的时代。\n三、百家争鸣\n1 背景:\n（1）经济：井田制崩溃，封建经济的形成和初步发展（根本原因）\n（2）政治：周王室衰微，宗法制及分封制瓦解，诸侯争霸兼并战争不断\n（3）阶级关系：“士”阶层的活跃和受重用\n（4）思想文化：从“学在官府”到“学在民间”\n2 派别：\n（1）儒家：孟子认为人性善,提倡“仁政”,荀子认为人性恶,主张隆礼重法。\n\n（2）墨家：墨子，提倡节俭,主张“兼爱”“非攻”“尚贤”。\n（3）法家：韩非，主张以法治国,控制臣民,体现了中央集权的政治思想。\n（4）阴阳家：邹衍认为五行相互促进，相互制约，提出相生相胜理论。\n3、百家争鸣的影响: 是中国历史上第一次思想解放运动。为新兴地主阶级的崛起奠定了理\n论基础。成为中华思想文化的源头活水，影响十分深远。"}, {"title": "第3课 秦统一多民族封建国家的建立", "body": "一、秦的统一\n1、条件：长期战乱，人民渴望安定统一。经济的发展要求结束分裂局面。民族交融加强。\n商鞅变法使秦国强盛。\n2、过程：灭六国，建立秦朝，南征越族，北击匈奴，修建万里长城。\n3、秦巩固统一的措施：\n（1）确立皇帝制度，皇权至高无上，皇位世袭。\n（2）设三公九卿,三公是指丞相、太尉、御史大夫。丞相帮助皇帝处理政务，太尉主管军\n务，御史大夫负责监察百官。\n（3）废除分封制，推广郡县制：郡县长官由中央皇帝直接任免。\n（4）统一文字，货币，度量衡。颁布《秦律》。\n4、意义： （1）实现中央对地方直接有效的控制（中央垂直管理地方），是官僚政治取代\n贵族政治的重要标志；（2）秦朝专制主义中央集权制度的意义：奠定了中国两千多年政治\n制度的基本格局，为历代王朝所沿用，且不断加强和完善。\n5、秦朝二世而亡的原因：(1)“轻罪重罚”的苛政暴政(2)沉重的赋税和徭役负担(3)政治\n腐败(4)文化的专制与落后。"}, {"title": "第4课 西汉与东汉 统一多民族封建国家的巩固", "body": "一、西汉的建立与文景之治\n1 文景之治： (1)背景：吸取秦朝速亡的教训。尊奉黄老无为思想，采取与民休息政策。（2）\n措施：与民休息，轻徭薄赋，减轻刑罚，提倡节俭，减少财政支出。（3）表现：经济得到\n恢复，社会稳定。\n2 政治制度：地方：郡国并行制——七国之乱——推恩令\n二、西汉的强盛\n1 汉武帝加强中央集权的措施\n（1）政治：①颁布“推恩令”,成功削弱了诸侯王的势力；②加强皇权,削弱丞相权力,设\n立中朝,尚书令的作用开始提升；③确立以察举制为代表的新的官吏选拔制度；④将全国划\n分为 13 个州部,分设刺史,负责对辖区内郡级官员及子弟和豪强势力进行巡视监察；⑤任用\n酷吏治理地方,严厉打击豪强、游侠等社会势力的不法行为。\n（2）经济：①改革币制,将铸币权收归中央；②实行盐铁官营,由政府垄断盐、铁的生产和\n销售；③推行均输平准,国家插手并经营商业贸易,增加收入,平抑物价；④抑制工商业者,\n向他们征收财产税。\n（3）思想：接受董仲舒的建议,尊崇儒术；公元前 136 年,设立五经博士,儒学独尊地位确\n立。此后,儒学成为我国封建社会的主流意识形态。\n2 开拓疆域：（1）派遣张骞出使西域，开辟丝绸之路，促进了西域与中原的政治，经济、\n文化联系。 （2）在新疆设置西域都护府管理西域。（3）北击匈奴，控制河西走廊，并设\n郡管辖。\n3 两汉的文化\n（1）史学：西汉司马迁《史记》,首创传体通史。东汉班固《汉书》,是我国第一部纪传体\n断代史。\n（2）文学：汉赋：讲究铺陈排比，辞藻华丽。乐府诗：\n（3）医学和科技成就：《黄帝内经》奠定了中医理论的基础。东汉的《神农本草经》是中\n\n国古代第一部药物学专著。数学《九章算术》。105 年，东汉蔡伦改进造纸术。促进了世界\n文化的传播和发展。"}, {"title": "第5课 三国两晋南北朝的政权更迭与民族交融(220～589 年)", "body": "一、江南的开发\n1、原因：\n（1）劳动力与技术因素：北方人口南迁，带去了充足的劳动力和先进的生产技术。\n（2）自然环境：江南地区雨量充沛，气候温润，土地肥沃，具有发展农业的优越条。件\n（3）社会环境：江南地区战争相对较少，社会秩序比较安定。\n2、影响：促进江南地区开发，为经济重心南移奠定了基础；促进民族交融；加强了南北经济联系。\n二、北魏孝文帝改革\n1、背景：北魏于 439 年统一北方；5 世纪后期北魏孝文帝拓跋宏在位，实行改革\n2、内容：\n（1）将都城从平城迁到洛阳，迁到洛阳的鲜卑贵族一律将籍贯改为洛阳；\n（2）以汉族服饰取代鲜卑服饰，朝中禁鲜卑语，统一说汉语；改鲜卑姓为汉姓，皇族拓跋氏改姓\n元；将新改姓的部分鲜卑贵族定为一等高门，并鼓励他们与汉族高门士族通婚。\n3、积极影响：改革措施顺应了北方民族交往交流交融的历史趋势，大大缓解了民族矛盾，促进了\n北魏的经济发展和社会繁荣，为以后北方统一南方以及隋唐盛世的出现打下了基础。"}, {"title": "第6课 从隋唐盛世到五代十国(581～907 年)", "body": "一、隋朝兴亡\n1 隋朝的建设：建洛阳城，开通大运河，贯通南北，促进南北经济交流，巩固了国家统一。\n2 隋朝的灭亡：隋炀帝大兴土木，征伐高句丽，严重破坏生产，激化阶级矛盾。618 年，隋朝灭亡。\n二、唐朝的繁荣与民族交融\n1、 贞观之治：李世民吸取隋亡教训，轻徭薄赋，劝课农桑，戒奢从简，知人善任，虚怀纳谏。\n2、唐朝与少数民族关系：\n（1）贞观年间，反击东突厥，俘获东突厥可汗。联合回纥灭西突厥。\n（2）为加强对西域的管理，设置安西都护府与北庭都护府。\n（3）文成公主入藏，嫁给吐蕃首领松赞干布，唐蕃和亲，促进了汉藏的友好关系和经济文化交流。\n（4）册封回纥首领。封东北的靺鞨族首领为渤海郡王。\n3、安史之乱：\n（1）背景：开元年间，边境军镇长官节度使兵力扩大。国家出现外重内轻的局面。\n（2）经过：755 年安禄山在范阳起兵叛乱，后被唐平定。\n（3）影响：唐朝由盛转衰，逐渐形成藩镇割据的局面，中央集权被削弱北方人民大量南迁，经济\n重心进一步南移。\n4 黄巢起义：由于宦官专权，朋党之争加剧，人民赋税沉重，生活困苦，阶级矛盾激化。875 年，\n黄巢起义。"}, {"title": "第7课 隋唐制度的变化与创新", "body": "一、选官制度\n1.九品中正制：曹魏时期创立，选官标准主要看重家世，门第，逐渐成为维护士族特权的工具。\n2 科举制：\n（1）背景：士族没落，九品中正制无法继续。庶族地主势力壮大，他们要求分享政治权利。\n（2）创立：隋炀帝时，始建进士科。\n（3）影响：①科举制打破了世家大族对选拔人才的垄断,扩大了封建政权的统治基础,有利于中央\n集权的加强②科举制的实行提高了官员的文化素质,为行政效率的提高创造了条件\n\n③科举制促进了古代教育的发展,有益于社会形成重学风气\n二、三省六部制\n1、内容：隋文帝正式确立三省六部，中书省负责草拟皇帝的诏令，门下省负责审核诏令，有不妥\n者驳回。尚书省负责执行，下设吏，户，礼，兵，刑，工六部，分工处理各项政务。\n2、唐朝三省六部制的特点及其作用：\n(1)三省长官都是宰相，相权一分为三，削弱了相权，加强了皇权。\n(2)三省六部分工明确，职权分明，各司其职，相互配合，提高了行政效率。\n(3)相权一定程度上可以节制君权。\n(4)宰相集体议政，集思广益，一定程度上减少决策失误。\n三、赋税制度\n1 唐初租庸调制：\n（1）前提：均田制的推行。内容：除租、调外，男子不去服徭役可以纳绢或布代役，称为庸。\n（2）意义：以庸代役保证农民有充分的生产时间，政府的赋税收入也有了保障。\n2 两税法：\n（1）背景：土地买卖兼并盛行，在籍户口大幅减少，均田制无法推行，租庸调制也无法维持，政\n府财政收入锐降\n（2）概况：780 年、唐德宗、杨炎\n（3）内容：①由中央政府确定总的税额，分配到各地征收；②户不分主户和客户，以当时的居住\n地，编入户籍；③每户按人丁和资产缴纳户税，按田亩缴纳地税，取消租庸调和一切杂税、杂役；\n④一年分夏季和秋季两次纳税。\n（4）意义：①两税法简化税收名目，扩大收税对象，保证国家的财政收入②改变了自战国以来以\n人丁为主的赋税制度，减轻了政府对农民的人身控制\n（5）弊端：①土地兼并不再受限制，越来越严重，激化了阶级矛盾②大地主隐瞒财产，转嫁赋税，\n政府又增加许多苛捐杂税，农民负担更加沉重。\n【中国古代选官制度】\n朝代 先秦 汉代 魏晋南北朝 隋唐至明清时期\n制度 世官制 察举制 九品中正制 科举制\n依据 血缘 孝廉 门第 才学\n方式 世袭 推荐 品评 择优录取"}, {"title": "第8课 三国至隋唐的文化", "body": "一、儒学、道教与佛教的发展\n1、儒学的发展\n（1）汉武帝时期:儒学正统地位确立后,呈现繁盛之势。\n（2）魏晋南北朝：儒学吸收佛教和道教精神，有了新发展。佛教渐趋中国本土化。\n（3）隋朝:提出儒、佛、道三教合归儒。主张以儒学为主,调和并吸收佛教、道教思想。\n（4）唐朝：奉行三教并行政策。\n2、佛教的发展与挫折\n（1）魏晋南北朝时期：佛教在中国盛行，逐渐吸收儒、道的精髓，渐趋本土化。\n（2）反佛灭佛：南朝思想家范缜提出人精神和肉体是统一的，对佛教进行抨击。统治者四次灭\n佛。\n二、文学艺术\n（1）魏晋南北朝文学：出现建安文学、东晋陶渊明的田园诗、南朝骈文、南北朝民歌。\n（2）唐朝诗歌：李白和杜甫被誉为诗仙和诗圣。\n（3）书法：东晋大书法家王羲之被称为书圣。隋唐时期：颜真卿和柳公权最为有名。\n（4）绘画：东晋画家顾恺之，提出以形写神，代表作是《女史箴图》《洛神赋图》。唐朝的吴\n道子被尊为画圣。\n\n（5）石窟：云冈石窟、龙门石窟、敦煌莫高窟。\n三、科技\n1 数学：南朝祖冲之把圆周率的数值精确到小数点以后的七位数字。\n2 农学：北朝贾思勰的《齐民要术》.是中国现存最早的农书。\n3 地理学：西晋裴秀绘制出《禹贡地域图》\n4 建筑：隋朝李春设计建造的赵州桥,是世界上现存最古老的石拱桥。\n5 唐朝有雕版印刷的佛经和书籍。唐末,火药开始用于战争。唐朝天文学家僧一行,测算出了地球\n子午线的长度。\n6 医药学：唐代医学家孙思邈著《千金方》。《唐本草》是世界上最早由国家颁行的药典。\n四 中外文化交流\n1、东晋的法显去天竺收集梵文。唐朝高僧玄奘西行前往天竺取经。佛教向中国传播。\n2、唐朝高僧鉴真东渡日本，传授佛法。\n五 隋唐科技文化辉煌灿烂\n1 原因：（1）国家统一强盛，经济繁荣。（2）对外政策开明开放。（3）国内各民族交往密切，互相\n交流。（4）中外往来频繁，吸收了外来文化优秀部分。\n2 影响：唐朝文化影响深远，促进亚洲文明的发展和西方文明的进步。是中华文明圈的源流。"}, {"title": "第9课 两宋的政治和军事", "body": "一、宋初中央集权的加强\n（1）背景：北宋建立后，结束五代十国的分裂局面。鉴于唐后期以来军阀割据、政局动荡历史教\n训。\n（2）措施：\n①制约钱粮：设转运司，将各州赋税绝大部分上缴朝廷。\n②收编精兵：地方精锐编入中央禁军，保卫京师。\n③监察地方：派文官出任地方各州的长官。并设通判制约。设四监司，对各州进行监控。\n④削弱相权：把相权一分为三。实行二府三司制：设枢密院分割宰相的军权、参知政事分割宰\n相的行政权、三司分割宰相的财政权；\n⑤抑制武将：实行崇文抑武，提高文官地位。\n（3）特点：守内虚外；强干弱枝；分化事权；崇文抑武。\n（4）影响：有效预防了内部动乱，巩固了国家的统一和安定，强化了中央集权。但束缚过度，权\n力分割过细，影响了行政效率。造成了严重的财政危机和边防危机。\n二、王安石变法:\n(1) 背景: 冗兵冗官导致财政危机。国家积贫积弱。土地兼并导致社会矛盾激化。\n(2) 目的：富国强兵\n(3) 措施：①青苗法：政府向农民提供农业贷款。市易法：政府拨巨资从事商业经营。②保甲法：\n对农民进行军事训练，恢复兵农合一的征兵制。\n(4)评价：达到了富国目的，增加大笔收入。强兵的效果不明显 变法执行过程中加重了人民的负担。\n没有挽救北宋衰亡的命运。"}, {"title": "第10课 辽夏金元的统治", "body": "一、辽与西夏\n1、辽的建立：916 年，契丹族首领耶律阿宝机建立。\n2、辽的政治制度：南北面官：南面官负责以汉人为主的农耕事务。北面官负责契丹等游牧民族事\n务。\n3、西夏的建立：1038 年，党项族首领元昊称帝，定都兴庆府。\n二、金朝入主中原\n1、建立：1114 年，女真族首领完颜阿骨打举兵反辽，1115 年称帝，建立金朝，定都会宁府。\n\n2、制度：猛安谋克制：凡女真民户，300 户编为一谋克，10 谋克编为一猛安。平时耕作，战时出\n征，兵农合一。意义：提高了女真军队战斗力。\n三、从蒙古崛起到元朝统一\n1 蒙古建立：1206 年，蒙古部首领铁木真统一草原，建立蒙古汗国。1260 年，忽必烈即位，兴\n建大都作为首都。\n2 元朝社会治理\n（1）对地方：实行行省制度。加强了中央集权，巩固了多民族国家的统一。\n（2）对吐蕃：由直属中央政府的宣政院进行管理。\n（3）对西域：设北庭都元帅府 、宣慰司等管理军政事务。\n（4）对台湾：在澎湖设置巡检司，以经略台湾。\n（5）民族政策：实行四等人制。"}, {"title": "第11课 辽宋夏金元的经济与社会", "body": "一、农业和手工业的发展\n1 棉花在元朝得到大力推广，棉纺织业发展。\n2 宋朝制瓷技术发达，出现了五大名窑。\n3 宋元时期，瓷器大量出口海外，成为中华文明新的物质象征。\n二、商业和城市的繁荣\n1、商品市场形式多样：为大众服务基层市场蓬勃涌现。官方设置榷场进行互市交易，民间贸易也\n相当活跃。\n2、城市商业经济发达：《清明上河图》描绘北宋东京繁华，南宋临安市场活跃，交易频繁，娱乐活\n动丰富多彩。\n3、对外贸易发达：以海上丝绸之路为主要渠道的对外贸易发达，是古代商业的重要组成部分，并\n推动沿海港口城市兴盛。\n4、货币种类不断丰富：在货币流通领域，北宋钱币年铸造量大大提高，出现世界上最早纸币，交\n子。\n5.经济重心南移 ：（1）魏晋南北朝：江南地区得到初步开发。（2）中唐以后：南北经济总量基本\n持平。（3）南宋：经济重心南移完成。\n四 宋朝的社会变化：\n1、人们的门第观念淡化，科举制更加公平，大批平民进入政坛。\n2、人身依附关系松弛，国家对社会的控制松弛，朝廷对土地买卖基本不加干预。\n五 程朱理学\n1、背景：儒学日益僵化，独尊地位动摇；宋朝为加强专制主义中央集权，需要重建纲常伦理；\n2、代表人物：北宋的程颐、程颢，南宋的朱熹。\n3、内容：\n①宇宙观：认为“理”是自然界和社会的根本原则，也称“天理”。\n②人生观：人生的目标，应当是“存天理，灭人欲”，即通过道德修养克服过度的欲望，最终实现。\n③认识论：“格物致知”，对“天理”的充分体验，从而达到“圣人”的精神境界。\n4、特点：①儒学进一步思辨化。②更调伦加强理道德为思想核心。③更多吸收了佛、道因素。\n5、地位：程朱理学受到官方尊崇，在历史上产生了深远影响。\n6、评价：（1）积极：有利于培养中华民族的道德修养，民族气节，和社会责任感。（2）消极：\n过分强调天理，扼杀人的自然欲望，维护封建专制统治，束缚了人们思想。\n六 文学艺术\n1、宋词繁荣：商品经济的发展，市民阶层活跃。豪放派的苏轼、辛弃疾和婉约派的柳永、李清照。\n2、元曲、杂剧：代表作家：关汉卿、王实甫。元杂剧标志着我国古代戏曲艺术的成熟。\n三、科技\n1、三大发明：北宋毕昇发明活字印刷术。火药用于军事。指南针应用于航海。促进人类文明进步。\n\n2、科学家：北宋沈括著《梦溪笔谈》。元朝郭守敬编订《授时历》。元朝王祯编撰《农书》。\n四、少数民族文字：成吉思汗命人使用畏兀儿文字，形成畏兀体蒙古文。编修《蒙古秘史》。"}, {"title": "第12课 从明朝建立到清军入关", "body": "一、明朝政治制度的变化\n1、明朝建立：1368 年，朱元璋称帝，定都应天府。\n2、明太祖废除宰相制度：\n（1）原因：宰相权力过重，威胁皇权。\n（2）目的：加强皇权。\n（3）影响：①君主专制进一步加强；②缺少制约皇权机制，没有法定辅臣，以致宦官专政。\n3、明成祖设立内阁：\n（1）原因：宰相废除后，皇帝政务繁忙。\n（2）内阁性质：辅佐皇帝处理政务的秘书机构。\n（3）内阁职权：替皇帝浏览奏章，草拟处理意见，称为票拟。皇帝用红笔正式批复奏章，称为批\n红。\n4 、宦官专权：司礼监获得协助皇帝批红的权力。提督东厂，对官民进行监视，逮捕。\n二、郑和下西洋\n1、条件：明朝前期国力强盛。造船技术的发达，指南针的运用，天文地理知识的不断积累。\n2、特点：时间早、次数多、规模大、范围广且影响深远。\n3、影响：（1）扩大中国同亚、非国家经济文化的交流，使明朝同 30 多个国家和地区建立友好关系。\n（2）影响东南亚等国人民生产和生活，中国的铁器在东南亚一些国家广泛使用，促进了其农业生\n产的发展。\n三、沿海危机\n1.东南沿海的“倭患”\n（1）从元朝末年起，日本海盗不时在我国东部沿海骚扰，被称为“倭寇”。明朝前期，朝廷严禁海\n外贸易，东南沿海地区的一些海盗、奸商等与倭寇勾结，进行走私活动，造成巨大破坏。\n（2）明廷派遣大将戚继光、俞大猷等人平倭，重创倭寇。东南沿海形势稳定下来，朝廷遂放松对\n私人海外贸易的限制。\n2.欧洲殖民扩张与争夺：（1）明朝中后期，随着新航路的开辟，欧洲殖民者在中国沿海的活动日\n益频繁。（2）16 世纪中期，葡萄牙人获得了在濠镜澳的租住权。（3）荷兰和西班牙分别占据 台湾\n岛 的南部和北部。（4）明朝末年，西班牙被荷兰击败，退出台湾。\n三、明朝的边疆关系\n（1）西藏：明廷封授当地僧俗首领法王称号，设立行都指挥使司管理西藏军民事务。\n（2）东北：在黑龙江设立奴儿干都司,对女真部落首领封授官号。\n（3）蒙古：重新修筑长城抵御，鞑靼首领与明朝订立和议，接受明朝册封双方恢复贸易关系。"}, {"title": "第13课 清朝前中期的鼎盛与危机", "body": "一、康乾盛世：清朝皇帝康熙、雍正、乾隆在位期间，出现了 100 多年的鼎盛局面，政局稳定，\n经济繁荣，疆域开拓并巩固，被称为“康乾盛世.”。\n二、君主专制强化\n1、奏折制度：部分官员向皇帝单独呈送密封报告，皇帝亲手批阅后返回，不经过其他中转、收发\n环节。特点：迅速、机密。作用：使皇帝能够更直接、广泛地获取信息，提高了决策效率 ，强化\n了对官僚机构的控制。\n2、设立军机处\n（1）概况：雍正时，在皇帝寝宫旁边设立\n（2）职责：在皇帝直接监督下工作，日夜轮流值班，商议军情，起草或处理机要文书\n3、制造文字狱： （1）目的：严密控制 思想文化 ，（2）影响：对文化造成严重的摧残，\n\n三、经略边疆的措施\n东南：\n经略台湾\n（1）1662 年， 郑成功 驱逐荷兰殖民者，收复台湾（2）1683 年，清军渡海远征，\n郑氏后裔战败投降（3）1684 年，清朝在台湾设府，隶属福建省。\n东北：\n反击沙俄\n（1）17 世纪中叶，沙俄势力侵入我国黑龙江流域。\n（2）康熙前期，清军围攻侵占雅克萨的俄军，迫使沙俄同意进行谈判。\n东北：\n反击沙俄\n（3）1689 年，中俄签署 《尼布楚条约 ，从法律上确定黑龙江、乌苏里江流域\n包括库页岛在内的广大地区都是中国领土。\n西北：\n平定叛乱\n（1）1757 年，平定准噶尔部叛乱（2）乾隆时，平定大、小和卓叛乱。\n（3）在蒙古族地区设立盟、旗两级单位进行统治。\n（4）1762 年，在 新疆 设立伊犁将军，总领军政事务。\n西南：管辖\n西藏\n（1）册封达赖和班禅（2）1727 年，开始派遣 驻藏大臣 ，代表朝廷与达赖、班\n禅共同治理西藏（3）1793 年，颁布《钦定藏内善后章程》29 条，以法律形式明\n确和落实了中央政府对西藏地方的管辖权\n机 构 及 政\n策\n（1）专设理藩院.掌管蒙古族、藏族等民族事务\n（2）采取因地制宜政策，尊重各民族的社会习俗和宗教信仰优待各族上层分子.\n改土归流 土司有一定的割据性，为了强化清政府对西南地方各族的管理，加强中央集权，\n清政府在西南大规模推行改土归流。\n四、清朝的版图与区划\n1.疆域：西跨葱岭，西北达巴勒喀什池，北接西伯利亚，东北至外兴安岭和库页岛，东临太平洋，\n东南到台湾及其附属岛屿，包括钓鱼岛、赤尾屿等，南至南海诸岛，西南抵喜马拉雅山脉。\n2.区划：内地分立 18 省，分设巡抚、总督治理。在东北、北部和西部边疆，分设若干将军辖区.\n和办事大臣辖区。\n五、统治危机的初显\n1、内部危机——阶级矛盾激化：（1）清朝人口膨胀迅速， 资源危机 日益显露。（2）政治腐败和\n贫富矛盾的积累。（3）乾隆后期起，农民起义屡屡爆发，大部分是由 白莲教 领导的。\n2、外部危机——中外隔阂与矛盾加深\n1.西方寻求市场：要求扩大对华贸易，开拓中国市场。\n2.清朝闭关自守：（1）清朝起初指定四处对外通商口岸，后仅保留广州一处，并规定由官府特许的\n“十三行” 商人代为管理对外贸易事务。（2）外商在广州的活动及其与中国商民的交往，都受到\n严格约束；严厉禁止民间船只出海贸易。\n3.结果：无法适应新的外部环境，中国逐渐落后于世界潮流。"}, {"title": "第14课 明至清中叶的经济与文化", "body": "一、社会经济的发展与局限\n1、表现：\n农业 （1）新航路开辟，高产粮食作物玉米、甘薯推广种植，大幅度提高了粮食总产量\n（2）江南等地区农业的 多种经营 日益兴盛，农产品商品化程度提高\n手工业 明朝后期，在南方一些地区出现了新的经营方式，即开设工场，使用自由雇佣劳动 进\n行较大规模的生产（资本主义萌芽）。\n\n商业 货币 美洲等地白银大量流入，促进长途和大额贸易的发展，也有利于商业资本集聚\n商帮 徽商、晋商\n市镇 一大批以经济功能为主的工商业市镇兴起，成为地区贸易网络的核心\n2、局限\n（1）经济：男耕女织、自给自足的传统小农经济还占据压倒性优势。\n（2）政治：日益僵化的专制统治，也压制和阻碍着社会的进步和转型。\n二、明清思想领域的变化\n1.背景：商品经济发展，专制统治压制、阻碍社会转型；程朱理学获得官方尊崇后，逐渐失去活力。\n2.陆王心学\n代表 陆九渊、王守仁\n主张\n王守仁在南宋陆九渊思想的基础上，提出一套以 “致良知” 为核心的理论，形\n成陆王心学；“良知”就是隐藏在每个人心中的“天理”，往往被私欲遮蔽，需要\n重新发现、扩充和践行，这样就可以达到圣贤境界。\n评价 强调主观能动性，激励人们奋发立志；以自己的内心为准则，隐含一定的平等和\n叛逆色彩；带有主观唯心主义倾向\n3.李贽：提倡个性自由，蔑视权威和教条，甚至否定传统伦理道德标准，在社会上引起了很大震动。\n4.黄宗羲：严厉抨击君主专制制度，称专制帝王为“天下之大害”；提出“工商皆本”。\n5.顾炎武、王夫之对高度集权的政治制度进行了批判。顾炎武认为“保天下者，匹夫之贱与有责\n焉耳矣”，后人概括为“天下兴亡，匹夫有责”。\n6.明清之际进步思想评价：黄宗羲、顾炎武、王夫之等思想家挑战儒学正统地位，提倡个性，批\n判专制，否定君主专制等，他们的思想成为近代进步思想的先声。但这些思想虽具有进步性，却始\n终未突破传统思想的桎梏，不能将其等同于资产阶级民主思想。\n三、小说、戏曲与科技\n1.背景：城市商品经济繁荣、市民阶层壮大，社会娱乐活动丰富、文化知识进一步普及。\n2.成就\n时间 作者 作品 评价\n元末明初 施耐庵 《水浒传》 我国最早的两部长篇白话小说，开创了章回体的写作\n体裁罗贯中 《三国志通俗演义》\n明中期 吴承恩 《西游记》 神话小说的杰作\n清中期 吴敬梓 《儒林外史》 讽刺小说的杰作\n清中期 曹雪芹 《红楼梦》 我国古典现实主义文学的高峰，是享誉世界名著。\n3.明清小说繁荣的原因\n（1）工商业发展，城市繁荣，壮大了市民阶层，形成了要求表现自己思想和生活的广大读者群。\n（2）传统的宋元话本在新的社会条件下得到继承与发展，推动了通俗文学的发展。\n（3）印刷术不断完善，书坊迅速发展。\n（4）各种社会危机、社会矛盾逐渐加强，使更多文人对现实进行批判。\n4.戏曲：（1）明清戏曲创作趋向长篇化，情节更加曲折复杂，称为传奇，代表作家有明朝汤显祖（代\n表作《牡丹亭》）、清朝孔尚任（代表作《桃花扇》）等。\n（2）京剧：清朝道光年间，以徽班为基础，融合徽、汉二调，吸取 昆曲 和其他地方戏的艺术成\n分，形成了京剧，并且逐渐成为全国最流行的剧种。\n5.科技：（1）明朝后期重要科技著作（处于经验总结阶段，未转化为近代科学理论）：李时珍的《本\n\n草纲目》、徐光启的 《农政全书》 和宋应星的《天工开物》，分别系统记载了中国古代医药学、农\n学、工艺学的相关知识。徐弘祖的《徐霞客游记》是一部地理和地质学名著。\n6.西学东渐：（1）明朝后期：意大利人利玛窦等欧洲天主教传教士来华，与一些开明的中国士大\n夫合作翻译西方科学书籍，在一定范围内传播了西方科技知识。（2）清朝前期：传教士运用欧洲测\n绘技术，帮助清政府绘制了较为精确的全国地图。"}, {"title": "第15课 两次鸦片战争", "body": "一、19 世纪中期的世界与中国\n世界主要殖民主义国家 中国\n政治 资本主义 制度确立和发展 封建社会， 君主专制 统治顽固\n经济 工业革命后资本主义生产方式逐渐占主导地位 自给自足 小农经济 是主要的生产方式\n社会 社会稳定，经济飞速发展 社会阶级矛盾激化，农民起义此起彼伏\n军事 船坚炮利、战斗力强 科技落后；八旗和绿营作战能力低下，主\n要使用冷兵器，武器落后于英国\n对外 积极争夺市场、原料和殖民地，世界主要殖民主\n义国家都把侵略矛头指向中国\n闭关自守\n二、鸦片战争（1840—1842 年）\n1、背景 ：（1）中国英国工业革命对市场和原料的需求越来越强烈，各国争夺殖民地的斗争日趋激\n烈。清政府闭关锁国，英国想要打开中国市场。（英发动战争的根本原因）\n2．概况：1840.6——至 1842.8。1842.签订的第一个不平等条约《南京条约》1843《虎门条约》\n1844《望厦条约》、《黄埔条约》领事裁判权；片面最惠国待遇；通商口岸传教权。\n3．影响：\n①政治：中国的主权和领土完整遭到破坏，中国开始沦为半殖民地半封建社会，是中国近代史开端。\n②经济：自然经济开始解体，卷入资本主义世界市场，客观上为民族资本主义的产生奠定条件。\n③思想文化：先进知识分子，睁眼看世界（林则徐、魏源），掀起了一股“向西方学习”的新思潮。\n④社会转型：沦为半殖民地半封建社会；反帝反封为革命任务。民族矛盾、阶级矛盾。\n⑤对外：由闭关锁国到被迫开放。由朝贡体系到不平等条约体系，客观推动近代中国外交近代化。\n三、第二次鸦片战争（1856—1860 年）\n1、原因：（1）英国等侵略者在鸦片战争中未能达到鸦片贸易合法化的目的。（2）根本：列强想进\n一步打开中国市场。（3）直接：列强要求修约，被清政府拒绝。\n2、过程：（1）1856 年，英、法两国对中国发动了第二次鸦片战争，美、俄两国以调停人面目出现。\n（2）1858 年，清政府被迫分别与英、法、美、俄四国签订《天津条约》。（3）1859 年，英、法借\n换约进攻大沽炮台，遭清军反击。（4）1860 年 8 月，英法联军占领天津。10 月，英法联军抢劫、\n焚毁圆明园后，进入北京城，迫使清政府签订《北京条约》。\n3、结果： （1）通过《天津条约》、《北京条约》 ，英、法获取了割地（九龙司地方一区）、赔款、\n开放通商口岸以及内河航行权（侵略势力由东南沿海深入长江中下游）等大量权益；实现了鸦片贸\n易合法化。（2）俄国借机迫使清政府签订《北京条约》，并承认此前签订的 《瑷珲条约》 ，抢占\n黑龙江以北、乌苏里江以东 100 余万平方千米的中国土地。\n四、开眼看世界\n1、背景：清朝统治阶级高层封闭、愚昧与腐朽。\n2、概况：（1）林则徐：办译馆,罗致译员，收集有关西洋各国的消息情报和国际知识，包括国际\n法知识，汇译成《四洲志》等书稿。\n（2）魏源：编成 《海国图志》,是近代中国最早介绍外国历史地理的书籍之一；提出了“师夷之\n长技以制夷”的思想。\n（3）徐继：撰成《瀛寰志略》，该书注重对欧美各国的考察和介绍，是中国近代第一部世界地理著\n\n作。\n3、影响：这些开眼看世界的仁人志士，初步提出了向西方学习以求自强的主张。"}, {"title": "第16课 国家出路的探索与列强侵略的加剧", "body": "一、太平天国运动\n1、背景：的根本原因是阶级矛盾的激化，而不是民族矛盾的激化。\n2、《天朝田亩制度》\n(1)内容：提出了“有田同耕，有饭同食，有衣同穿，有钱同使”的主张。\n(2)结果：在当时的历史条件下，未能实施。\n(3)影响：否定了封建地主土地所有制，反映了农民追求社会财富平均的理想。\n（4）评价：① 革命性：废除地主土地所有制的愿望，极大调动了农民参加革命的积极性。\n②空想性：绝对平均分配土地方案，在当时的社会条件下未能真正实施（绝对平均分配产品的圣库\n制度，也是一种绝对平均主义的空想）。 ③落后性：固守小农经济（将使社会生产力停滞在分散的\n小农经济的水平上，实际上未超越封建经济的范畴）。\n3、《资政新篇》\n(1)主张：提出新的社会经济政策，试图回答农民革命应当向何处去的问题。\n(2)结果：在当时的历史条件下未能实施。\n（3）评价：① 先进性：是先进的中国人最早提出的在中国发展资本主义的一个比较完整的改革方\n案，反映了先进中国人向西方寻求真理和探索救民道路的愿望，符合时代发展潮流；②局限性：没\n有反映农民阶级的迫切愿望和要求；缺乏付诸实践的社会基础和条件\n4、太平天国运动影响 ：（1）沉重打击了清王朝的统治，引起了政治和权力结构的变化。\n（2）随着湘淮系官僚集团的崛起，中央权力下移，对历史的发展产生重大影响。\n5、太平天国运动失败的原因 ：①根本原因：农民阶级的局限性，缺乏科学思想理论的指导。②\n具体原因：中外反动势力的联合镇压。太平天国内部矛盾重重、腐败滋生，战略上的失误。\n6、认识：由于阶级和时代的局限性，农民阶级不可能领导民主革命取得胜利。\n二、洋务运动\n1.背景：内忧外患（太平天国运动、第二次鸦片战争）\n2.根本目的：维护清朝统治。\n3.指导思想：中体西用\n4.口号：“自强”、“求富”\n5.代表人物：奕䜣、曾国藩、李鸿章、左宗棠、张之洞。\n6.内容：\n（1）创办近代工业：为了自强，洋务派创办了一批官办的军事工业。（带有资本主义因素的\n封建性质的企业），如江南机器制造总局、福州船政局、天津机器局等。为了求富，洋务派\n又开办了一批官督商办的民用企业（带有封建因素的资本主义性质企业）如上海轮船招商局、\n上海机器织布局、开平煤矿等。\n（2）创办近代教育：创办新式学堂，培养翻译和军事人才（京师同文馆等）；派留学生出\n国，学习西方先进技术。\n（3）筹划海防，创办三支海军：北洋、南洋、福建海军。\n7.结局：失败。标志：1895 年甲午战争战败。\n8.失败的根本原因：未改变封建制度，只引进西方军事和生产技术。（中体西用）\n9.评价：\n（1）进步性：①洋务新政引进了资本主义国家的机器生产技术，是中国近代化开端。②客\n观上促进了中国民族资本主义的发展；对外国资本的入侵起了一定的抵制作用。③在一定程\n度上提高了清军的战斗力，加强了海防。④为近代中国培养了一批科技人才。\n\n（2）局限性：①期望洋务新政可以保障国家安全，抵抗外敌侵略目的未能达到。②不改变\n封建统治只是引进资本主义国家新军事和生产技术，是在封建制度基础上修修补补失败是必\n然的。\n四、边疆危机\n1、西北：1864，英国支持阿古柏入侵新疆，俄国占领伊犁；1878，左宗棠收复新疆。1884\n年，新疆建省。\n2、西南：1883，法国控制越南,发动中法战争；1885，镇南关大捷，签订《越南条款》，越\n南独立。\n3、东南：1879，日本吞并琉球；宗藩关系逐渐解体。1885，台湾建省。\n五、甲午中日战争\n1.背景：\n（1）日本通过明治维新壮大国力，“大陆政策”，侵华野心蓄谋已久。（根本原因）\n（2）因朝鲜发生农民起义，朝鲜国王请求清政府出兵。日本趁机出兵朝鲜，蓄意挑起战争。\n2.过程：\n(1)丰岛战役：日军在丰岛偷袭清朝运兵船。1894 年 8 月，甲午中日战争爆发。\n(2)平壤战役：1894 年 9 月，清军在平壤大败。\n(3)黄海战役：北洋舰队重创日本舰队，北洋舰队遭到重大损失。战后，李鸿章发出“避战\n保船”命令，北洋海军失去制海权。\n(4)威海卫战役：1895 年 2 月，日军在山东半岛登陆，摧毁了北洋舰队基地威海卫军港，北\n洋舰队全军覆灭。\n3.结果：清军战败，签订《马关条约》。\n内容 危害\n割辽东半岛、台湾全岛及其附属岛屿、\n澎湖列岛给日本（三国干涉还辽）\n进一步破坏了中国的主权，刺激列强瓜分中国的野心。\n赔偿日本军费白银 2 亿两 举借外债，列强进一步控制中国的经济命脉。\n开放沙市、重庆、苏州、杭州为商埠 侵略势力深入中国内地。\n允许日本在中国的通商口岸开设工厂 阻碍中国民族资本主义的发展，反映了列强资本输出、分\n割世界的要求\n4. 影响：（1）进一步把中国推到了半殖民地半封建社会的深渊。（2）甲午中日战争的失败，\n证明了洋务运动的破产。（3）西方列强掀起了瓜分中国的狂潮，民族危机日益加剧。（4）\n促进国人民族意识觉醒，各阶层掀起救亡图存运动。\n5.台湾人民反割台斗争： (1)概况：1895 年 5 至 10 月，台湾义勇军与以刘永福为首的黑旗\n军一起，展开反抗日军占领的武装斗争，重挫了日本占领军。 (2)意义：表明了台湾人民不\n屈服于日本的坚强意志。\n6.瓜分中国的狂潮：(1)“三国干涉还辽”：《马关条约》签订后俄、德、法“三国干涉还\n辽”。日本被迫归还辽东半岛，但向清政府索取 3000 万两白银“赎辽费”。(2)划分势力范\n围抢占租借地。(3) 列强掠夺路权和工矿利权。"}, {"title": "第17课 挽救民族危亡的斗争", "body": "一、戊戌维新运动\n1.历史背景：\n（1）社会背景（政治因素）： 甲午战后，列强掀起瓜分中国的狂潮，民族危机空前严重。\n（2）经济和阶级基础： 民族资本主义初步发展；民族资产阶级力量壮大。\n（3）思想基础： 西方近代思想和维新思想的传播奠定了理论基础。康有为《新学伪经考》和《孔\n子改制考》，为维新变法提供了理论依据。\n2.拉开序幕：“公车上书”拉开了维新变法运动的序幕。\n3.百日维新 ： 1898 年 6 月 11 日—9 月 21 日。 光绪帝在维新派推动下，颁布“明定国是”诏书。\n\n4.变法失败 ：1898 年 9 月 21 日慈禧太后将光绪皇帝囚禁，变法期间的改革措施，除京师大学堂\n均被废止。\n5.历史意义： ①政治：是一场爱国救亡的政治运动；一定程度上冲击旧式官僚体制；民族资产阶\n级试图在中国建立君主立宪制，揭开了政治民主化的序幕 。 ②经济：推动了民族资本主义经济发\n展 ；③思想：是近代一次思想解放运动，激发了人们的爱国情感和民族意识；推动了民主思想传\n播；。\n6.失败原因 ：(1)封建守旧势力仍很强大。 (2)维新派缺乏可靠的社会基础，没有严密的组织。\n(3)维新派把希望寄托于并未完全掌握实权的皇帝身上。 (4)变法措施头绪繁多，操之过急。\n二、义和团运动\n1、背景：（1）根本原因：《马关条约》签订后，西方列强掀起了瓜分中国的狂潮，民族危机日益加\n剧。\n（2）直接原因：西方势力深入中国城市、乡村后引发了一系列冲突。山东民众兴起以“扶清灭洋”\n为口号的反洋教斗争。\n2、清政府对义和团的政策：先后担任山东巡抚的毓贤、袁世凯等，对义和团采取 先抚后剿 的举\n措。\n慈禧太后采用“招抚”义和团的办法，企图对义和团加以控制利用。\n3、结果：在中外势力联合镇压下失败。\n4、评价：（1）进步性：具有强烈的反帝爱国倾向，粉碎了列强瓜分中国的企图。（2）局限性：存\n在明显的盲目排外行为；由于没有先进阶级的领导，无法阻止中国滑向半殖民地的深渊。\n三、八国联军侵化\n1、借口：镇压义和团运动。\n2、经过：天津出发→廊坊阻击战→联军攻陷大沽炮台，向天津进犯，天津保卫战失败→慈禧太后\n向各国宣战→8 月中旬，北京失陷，慈禧携光绪出逃，出逃途中发布“剿匪谕旨”，出卖义和团，\n并命李鸿章与列强议和。\n3、结果：\n（1）慈禧太后在逃亡途中发布铲除义和团谕旨，并指定庆亲王奕劻和李鸿章为全权代表与列强议\n和。\n（2）八国联军在所到之处烧杀抢掠，无恶不作。俄国军队趁机侵占中国东北。\n（3）南方各省督抚与英、美等国洽商 “东南互保” 协议，严重动摇了清政府统治的根基。\n（4）民族危机的加深：《辛丑条约》（1901 年签订）\n内容 危害\n惩办“首祸诸臣”，禁止华北科举考等地试 5 年，禁\n止中国人成立或加入任何“与诸国仇敌之会”等\n禁止中国人民反帝\n向各国赔款，本息共计白银约 9.82 亿两 加剧了中国的贫困和经济的衰败\n将北京 东交民巷 划定为使馆区，中国人不得居住，\n各国可派兵驻守\n使馆界实际成为“国中之国”\n拆除大沽及有碍北京至海通道的所有炮台，各国可在\n自北京至山海关沿铁路 12 个重要地区驻扎军队\n严重破坏了中国的主权完整\n改总理衙门为外务部，班列六部之前 列强通过外交加强了对清政府的控制\n评价：是中国近代史上主权丧失最严重、赔款数目最庞大的不平等条约。标志着中国完全陷入\n半殖民地半封建社会 的深渊。"}, {"title": "第18课 辛亥革命", "body": "一、辛亥革命爆发的时代背景\n\n1、时代背景：民族危机加深，各阶层救亡图存的探索均告失败。\n2、政治基础：清末新政和“预备立宪”加深了清朝统治危机，加速了辛亥革命爆发。\n（1）清末新政：1901 年初，中国民族危机加深，清政府试图通过“新政”进行“自救”。在 官制 、\n军事、商业、教育等方面进行了一系列改革，客观上为资产阶级民主革命准备了条件。由于政权掌\n握在极端腐败无能的权贵手中，清政府不可能为中国找到真正的出路。\n（2）预备立宪：1906 年 9 月，清政府宣布预备立宪。立宪派成立了预备立宪公会，积极推进立宪\n运动。1908 年 8 月，清政府颁布 《钦定宪法大纲》 ，作为制定“宪法”的准备。1911 年 5 月，\n清政府组织“皇族内阁”。结果：不少立宪派人士认识到清政府实无诚意推行立宪，转而支持革命。\n3、经济基础：民族资本主义的发展。\n4、阶级基础：民族资产阶级力量壮大。\n5、思想基础：资产阶级民主革命思想的传播。\n6、组织基础：资产阶级革命团体（兴中会）和政党（同盟会）建立。三民主义：孙中山在《民报》\n发刊词中首次提出民族、民权、民生三大主义，合称“三民主义”。\n7、军事基础：孙中山组织了多次反清武装起义，其中 1911 年 4 月 27 日的广州黄花岗起义引起了\n巨大震动。\n8、有利时机：四川发生保路运动使湖北防务空虚，为革命爆发提供有利时机。\n二、武昌起义与中华民国的建立\n1、辛亥革命的进程：1911 年 10 月 10 日晚，新军工程第八营打响了武昌起义第一枪，起义军控制\n武汉三镇，成立湖北军政府，推黎元洪为都督。湖南、广东等 14 个省和上海纷纷宣布脱离清政府\n独立。\n2、中华民国的建立：1912 年 1 月 1 日，孙中山就任中华民国临时大总统，南京临时政府成立。\n3、革命成果落入袁世凯手中：1911 年 12 月南北双方代表在上海和谈，选举临时大总统。1912 年\n2 月 12 日，清朝宣统帝下诏退位。1912 年 3 月 10 日，袁世凯宣誓就任临时民国大总统，革命果实\n落入袁世凯手中。\n4、颁布《中华民国临时约法》（1912 年 3 月 11 日）\n（1）目的：直接目的是防止 袁世凯 专权。根本目的：是维护资产阶级民主共和制度。\n（2）内容及体现的原则\n内容 体现的原则\n中华民国的主权属 全体国民 主权在民\n国民不分种族、阶级、宗教信仰，一律平等 民族平等人人平等\n国民有人身、居住、言论、出版、集会、结社、宗教信仰及请愿、\n考试、选举、参政等自由和权利\n自由民主\n以参议院、临时大总统、国务员、法院行使其统治权，国务员须副\n署临时大总统公布的法律及命令\n责任内阁制\n（3）地位：《中华民国临时约法》实际上确立了责任内阁制 ，是中国历史上第一部具有资产阶级\n共和国宪法性质的重要文件。\n三、辛亥革命评价\n1、性质：拉开了中国完全意义上的近代民族民主革命的序幕。\n2、进步性：\n（1）政治：推翻了清王朝统治，结束了中国两千多年的君主专制制度，建立起中国历史上从来不\n曾有过的共和政体。\n（2）经济：打击了帝国主义在华势力，为民族资本主义的发展创造了有利条。件\n（3）思想：传播了民主共和理念，推动了中华民族思想解放。\n（4）风俗文化：促使文化和社会风俗等方面发生新的变化。\n3、局限性：\n\n（1）革命任务未完成：没有解决近代中国社会的根本矛盾，没有完成民族独立、人民解放历史任\n务。\n（2）政党的局限性：缺乏一个能够提出科学的革命纲领、能够发动广大民众，以及组织严密的革\n命政党的领导。"}, {"title": "第19课 北洋军阀统治时期的政治、经济与文化", "body": "一、袁世凯复辟帝制\n1.袁世凯专权\n（1）1912 年 3 月，袁世凯在北京宣誓就任中华民国第二任临时大总统\n（2）1913 年 3 月，发生“宋教仁案”；11 月，袁世凯下令解散国民党\n（3）1914 年 5 月，公布《中华民国约法 》，改责任内阁制为总统制；同年底发布《修正大总统选\n举法》，规定总统任期十年，可连选连任\n（4）卖国：1915 年 5 月被迫签订不平等的“中日民四条约”\n（5）称帝：1915 年 10 月，“国民代表大会”表示一律“赞成”君主立宪；12 月袁世凯称帝\n2.护国战争\n（1）背景：面对袁世凯的倒行逆施，革命党人起而反抗。二次革命失败后，孙中山组织 中华革命\n党 ，武力讨伐袁世凯。袁世凯称帝的行径，激起全国人民的强烈反对.\n（2）过程：1915 年底，唐继尧、蔡锷、李烈钧在云南宣布独立，并组织护国军，发动护国战争，\n讨伐背叛共和的袁世凯。贵州、广西、广东、浙江、湖南、陕西、四川等省相继宣告独立。\n（3）结果：1916 年 3 月，袁世凯被迫宣布取消帝制，恢复中华民国纪年。\n二、北洋时期的军阀割据\n1.军阀割据的形成\n（1）原因：袁世凯称帝失败，不久死去,北洋军阀中难以产生一个能统御整个北洋派的人。北洋军\n阀内部派系纷争，很快发展为军阀混战与割据的局面。\n（2）表现：\n主要派系 代表 支持国 占据区域\n直系 冯国璋 英、美 直隶及长江中下游的苏、赣、鄂等省\n皖系 段祺瑞 日本 皖、浙、闽、鲁、陕各省\n奉系 张作霖 日本 东北三省\n（3）影响：各军阀争权夺利，先后爆发直皖、直奉混战，导致北京政权实际上由不同的军阀所控\n制。\n2.“府院之争”：袁世凯死后，段祺瑞出任掌握实权的国务总理，重新召开被袁世凯解散的国会。\n1917 年 5 月，继任总统 黎元洪 免去段祺瑞总理职务，造成所谓的“府院之争”（指以黎元洪为首\n的总统府与以段祺瑞为首的国务院之间的纷争,两者又分别依靠美、日的支持,反映了美、日矛盾，\n实质是帝国主义争夺在华利益的矛盾）。\n3.张勋复辟：1917 年，张勋以调解府院之争为名，率兵入京，解散国会，拥清废帝溥仪复辟。\n4.护法运动\n（1）背景：张勋复辟失败后，冯国璋代行大总统职权，段祺瑞就任国务总理。但段祺瑞公然破坏\n《中华民国临时约法》，拒绝恢复国会。\n（2）过程：1917 年 8 月，南下的 150 余名国会议员在广州召开非常会议，决定成立 中华民国军\n政府 ，推举孙中山为大元帅。\n（3）结果：西南军阀排挤孙中山。1918 年，孙中山辞去大元帅之职，护法运动失败。\n5.参加第一次世界大战\n（1）目的：争取国际地位，抑制日本在华势力的发展。\n（2）概况：参加协约国方面作战；收回德、奥在天津、汉口的租界，撤销两国领事裁判权；中国\n劳工前往欧洲前线。\n三、民国初年经济、社会生活的新气象\n\n1.经济：民族工业迅速发展\n（1）原因：①中华民国建立，扫除了政治上的一些束缚和障碍，为中国民族资本主义经济的发展\n提供了一定条件。②南京临时政府成立后，鼓励民间兴办实业。③第一次世界大战期间，西方列强\n忙于欧战。④群众性的反帝爱国斗争推动。\n（2）表现：以荣宗敬、荣德生兄弟开办的面粉厂、纱厂等为代表一批民族企业迅速壮大起来。\n（3）影响：中国产业工人的人数急剧增加，成为不可忽视的社会力量。\n2.社会生活的新气象\n（1）原因：共和政体的建立和南京临时政府的努力。\n（2）表现：\n（3）影响：越来越多的人认识到过去的陈规陋习不符合时代潮流，应接受 文明开化 的新习俗、\n新风尚。\n四、新文化运动的开展\n1.原因：源于对辛亥革命失败原因的痛苦反思。人们认识到中国缺乏对旧思想、旧文化、旧礼教的\n彻底批判，大多数国民的头脑仍被专制和愚昧牢牢地束缚着。\n2.兴起\n（1）兴起标志：1915 年，陈独秀在上海创办《青年杂志》，从第二期改为《新青年》；\n（2）代表人物：陈独秀、李大钊、鲁迅、胡适、蔡元培、钱玄同、刘半农等；\n（3）主要阵地:《新青年》\n（4）活动基地：北京大学（办学方针：“思想自由、兼容并包”）\n3.主要内容：\n(1)核心：提倡民主和科学，反对专制和愚昧；\n①拥护“德先生”(民主)：反对孔教、礼法、贞节、旧伦理、旧政治；民主不仅指西方资产阶级的\n民主制度，更强调人权、自由、平等、博爱等民主精神。\n②拥护“赛先生”(科学)：反对旧艺术、旧宗教；科学不仅指科学知识，更强调科学精神、科学世\n界观、反对迷信、反对偶像崇拜。\n(2) 提倡新文学，反对国粹和旧文学，主张以白话文作为新文学的语言。（文学革命）\n（3）提倡新道德，反对旧道德。\n5.影响\n（1）性质：资产阶级反封建的思想解放运动\n（2）积极：①高举民主与科学旗帜，推动思想文化革新和解放思想；动摇了封建思想的统治地位；\n②弘扬了民主与科学思想，推动中国自然科学的发展；③促进了马克思主义传播（新文化运动后期；\n④是一场文化转型运动；使用白话文，有利于文化普及（全国报刊面貌为之一新）；⑤妇女解放、\n婚姻自由、家庭革命等口号的提出，使其涉及的内容更为广泛和深刻。\n（3）局限：①对东西方文化的看法上存在着绝对否定和绝对肯定的片面性；②没有同群众相结合；\n③没有正面提出反帝的任务。"}, {"title": "第20课 五四运动与中国共产党的诞生", "body": "一、五四运动\n1.导火索：中国在巴黎和会上外交失败，和会决定将德国在中国山东的权益转让给日本。\n2.概况：\n阶段 前期 后期\n时间 1919 年 5 月 4 日起 1919 年 6 月 5 日起\n中心城市 北京 上海\n\n主力 学生 工人\n斗 争 形 式 及\n影响\n游行示威，高喊 “外争主权，内除国贼”\n等口号；学生爱国运动迅速向全国发展\n大规模的工人罢工、商人罢市;\n中国工人阶级登上政治舞台\n3.结果：北京政府释放了被捕学生；参加巴黎和会的中国代表拒绝在和约上签字。\n4.性质：（1）政治革命：一场以先进青年知识分子为先锋、广大人民群众参加的彻底反帝反封建.\n的伟大爱国革命运动。（2）民族革命：是一场中国人民为拯救民族危亡、捍卫民族尊严、凝聚民族\n力量而掀起的伟大社会革命运动。（3）思想启蒙：是一场传播新思想新文化新知识的伟大思想启蒙\n运动。\n5.意义：（1）推动了中国社会进步，促进了马克思主义在中国的传播。（2）促进了马克思主义同中\n国工人运动的结合，为中国共产党成立做了思想上干部上的准备。（3）是中国旧民主主义革命走向\n新民主主义革命的转折点.，在近代以来中华民族追求民族独立和发展进步历史进程中具有里程碑\n意义。\n二、马克思主义的广泛传播\n1.开始时间：俄国十月革命后。\n2.中心：北京与上海。\n3.传播方式：\n（1）著书立说：1919 年，李大钊发表了《我的马克思主义观》，系统介绍了马克思主义学说。\n（2）组织团体：1920 年，李大钊发起中国最早研究马克思主义的团体——马克思学说研究会；陈\n独秀 在上海组织了马克思主义研究会。\n（3）翻译书籍：李达、陈望道、李汉俊等人，投身于马克思主义学说的翻译和宣传。\n二、中国共产党的诞生\n1、条件\n（1）经济根源：一战期间，中国民族工业迅速发展\n（2）思想基础：马克思主义的广泛传播\n（3）阶级基础：中国工人运动的持续发展\n（4）组织基础：中国共产党早期组织和共产党小组的建立\n（5）外部条件：1920 年 4 月，共产国际派代表来到中国，先后与李大钊、陈独秀商议建党事宜。\n2、标志：中共一大\n（1）时间：1921 年 7 月。\n（2）地点：先在上海举行，后转移至浙江嘉兴南湖一艘游船上。\n（3）内容：①确定党的名称为中国共产党。②明确了中国共产党的奋斗目标是推翻资产阶级，建\n立无产阶级专政，实现社会主义和共产主义。③选举产生了党的领导机构，陈独秀任书记。\n（4）意义：①中国共产党的成立，是一个开天辟地的大事变，给灾难深重的中国人民带来了光明\n和希望。②中国共产党的成立，使中国革命有坚强的领导力量，有了正确的前进方向，中国人民有\n了强大的凝聚力量，中国命运有了光明的发展前景。从此，中国革命的面貌焕然一新。\n三、国共合作与国民革命\n1.国共合作背景\n（1）中国共产党成立后，在大力开展工人运动的同时，认识到必须建立 革命统一战线 。\n（2）1923 年，中共三大在广州举行，通过了关于国共合作问题的决议。\n2.国共合作实现：1924 年 1 月，中国国民党第一次全国代表大会召开。会议提出了 新三民主义 的\n主张，实际上通过了联俄、联共、扶助农工三大政策，第一次国共合作正式形成。\n3.国共合作意义：（1）以国共合作为特征的革命统一战线的建立，加速了中国革命的进程。（2）\n以 “打倒列强，除军阀” 为目标的国民革命席卷全国。\n4.国民革命:（1）1925 年，国民政府在广州成立。（2）通过再次东征消灭了陈炯明的势力，广东\n革命根据地得到巩固和统一。（3）1926 年，国共两党合作开始北伐，使革命势力从珠江流域发展\n到长江流域，基本推翻了北洋军阀的反动统治。\n\n5.国民革命结果：失败\n（1）原因：统一战线内部争夺领导权斗争加剧；孙中山逝世后，国民党右派篡夺领导权活动猖獗。\n（2）标志：1927 年 4 月 12 日，蒋介石在上海发动反革命政变；7 月 15 日，汪精卫集团武汉“分\n共”。"}, {"title": "第21课 南京国民政府的统治和中国共产党开辟革命新道路", "body": "一、南京国民政府的统治\n1、政治：实行国民党一党专制统治\n（1）“宁汉合流”：1927 年秋，武汉国民政府与南京国民政府合并，标志着中国国民党专制统治确\n立。\n（2）继续北伐：1928 年，国民政府继续北伐，讨伐张作霖。日本帝国主义为阻挠北伐，制造 “济\n南惨案” 。\n（3）国民党 1928 年通过《训政纲领》又颁布《中华民国国民政府组织法》实质仍是国民党专制统\n治。\n（4）皇姑屯事件：1928 年 6 月，日本见张作霖不能满足他们的侵略要求，在皇姑屯将他炸死。\n（5）东北易帜：1928 年底，张作霖之子张学良通电全国，宣告东北三省服从国民政府，改旗易帜。\n至此，国民政府在形式上基本统一了全国。\n2、经济：民族工业在夹缝中发展\n（1）表现：除了原有的纺织、面粉等行业外，民族工业中的新兴部门如化学、橡胶、搪瓷等，都\n有了一定程度的发展。\n（2）推动因素：国民政府建立后，民族资产阶级兴办实业的热情有所提高；中国人民的反帝爱国\n运动蓬勃开展，抵制洋货、提倡国货。\n（3）阻碍因素：官僚资本凭借国家权力迅速聚敛起巨额财富，四大银行成为他们巧取豪夺重要工\n具。\n二、工农武装割据开辟革命新道路\n1、必要性：国民革命失败后，中国共产党开始认识到掌握武装力量的重要性。\n2、武装起义和重要会议\n南昌起义\n1927 年 8 月 1 日，周恩来等领导了南昌起义，南昌起义打响了武装反抗国民党反动派\n的第一枪，是中国共产党创建人民军队的开始。\n八七会议\n（1）1927 年 8 月 7 日，在汉口召开。\n（2）内容：总结了国民革命失败的教训；纠正了陈独秀的右倾机会主义错误；确定了\n实行 土地革命 和武装反抗国民党反动派的总方针；毛泽东提出了“政权是由枪杆子\n中取得的”重要思想。\n秋收起义 八七会议后，毛泽东组织领导湘赣边界秋收起义，1927 年 9 月，进攻长沙途中受挫。\n3、开辟革命新道路\n（1）创建井冈山革命根据地\n①创建：1927 年 10 月，毛泽东率领秋收起义的部队到达井冈山，开展游击战争，进行土地革命，\n建立红色政权，开始创建第一个农村革命根据地。\n②会师：1928 年，朱德、陈毅率领的革命队伍到达井冈山，和毛泽东领导的工农革命军会师。\n③意义：点燃了 “工农武装割据” 的星星之火。从此，中国革命走上了建立农村革命根据地，以\n农村包围城市，武装夺取政权的道路。\n（2）武装斗争：①1929 年，古田会议重申了中国共产党对红军实行绝对领导的原则。②1930 年\n至 1933 年打退了国民党军队的四次“围剿”。\n（3）土地革命\n\n①措施：各农村革命根据地逐步开展土地革命，“打土豪，分田地”。\n②意义：受到广大农民的欢迎。他们拥护中国共产党，积极发展生产，支持革命。\n（4）根据地建设：①到 1930 年夏，全国已经建立起大小十几块农村革命根据地分布在十多个省\n革命武装力量达十万人。②1931 年 11 月，中华苏维埃第一次全国代表大会在江西 瑞金 召开，宣\n布成立中华苏维埃共和国临时中央政府。这是中国共产党人创建人民革命政权的宝贵探索与尝试。\n三、红军长征\n1、背景：由于共产国际的指导脱离中国革命实际，中共中央犯了“左”倾错误，导致第五次反“围\n剿”失利。\n2、开始：1934 年 10 月，开始长征。“左”倾错误领导人犯退却中逃跑主义错误，中央红军损失巨\n大。\n3、转折： 遵义会议（1935 年 1 月）\n（1）内容：集中全力解决军事和组织问题，改组中央领导机构，增选毛泽东为政治局常委。\n（2）意义：开始确立以毛泽东为主要代表的马克思主义正确路线在党中央的领导地位，在极其危\n急的情况下，挽救了党，挽救了红军，挽救了中国革命；标志着中国共产党在政治上开始走向成熟，\n预示着中国革命即将走向新的征程。\n4、胜利会师：（1）遵义会议后，红一方面军四渡赤水，巧渡金沙江，强渡大渡河，飞夺泸定桥，\n爬雪山，过草地，1935 年 10 月到达陕北吴起镇，与陕北红军会师。（2）1936 年 10 月，红军三大\n主力在甘肃会宁地区会师，红军长征胜利结束。\n5、意义：（1）长征实现了红军的战略大转移，宣传了中国共产党的政治主张，在沿途播下了革命\n种子。（2）鼓舞了广大人民群众，铸就了长征精神，打开了中国革命的新局面。"}, {"title": "第22课 从局部抗战到全国抗战", "body": "一、日本局部侵华\n1.侵华背景\n（1）既定国策：1927 年，日本召开东方会议，确立了侵略中国的总方针。\n（2）根本原因：日本资本主义发展的需要。\n（3）直接原因：为缓和国内矛盾，摆脱 1929 年开始的资本主义经济危机造成的困境。\n（4）国共内战：国民政府正全力“剿共”，给日本以可乘之机。\n（5）国际社会：西方主要资本主义国家陷于经济金融恐慌，忙于解决本国的经济危机，无暇东顾。\n2.表现\n九一八事变 1931 年 9 月 18 日，日本关东军袭击中国东北军驻地北大营和沈阳城，制\n造了九一八事变。这一事变标志着中国局部抗战的开始\n一·二八事变 1932 年 1 月 28 日，日军在上海挑起侵略战争\n日本扶持傀儡 1932 年 3 月，日本扶植清废帝溥仪在长春建立伪满洲国\n华北事变 日本逼迫国民政府签署一系列协定，实际上控制了热河、河北、察哈尔\n三省，又策动所谓 “华北自治运动”。\n3、国共两党对待日本侵略的政策\n（1）国民政府：推行 “攘外必先安内” 方针（表面看起来是先安定国内，后抗日，实际是置民\n族危亡于不顾），实行不抵抗政策，幻想依赖国际联盟迫使日本撤兵。\n（2）中国共产党：1935 年，中国共产党发表“八一宣言”，号召“停止内战，一致抗日”。召开瓦\n窑堡会议，确定了建立抗日民族统一战线的方针。\n3、抗日救亡运动\n爱国军人 1932 年一·二八事变爆发后，驻守上海的十九路军奋起抵抗;1933 年长城抗战\n东北人民 由游击队改编而成的 东北人民革命军 坚持抗战\n\n学生 1935 年 12 月 9 日，北平学生发起一二·九运动，促进了中华民族的新觉醒，\n抗日救亡运动掀起高潮\n共产党员 1936 年，东北抗日联军在共产党员杨靖宇、赵尚志等领导下浴血奋战\n4、西安事变\n（1）背景：在中共 抗日民族统一战线 政策的感召下，张学良和杨虎城在西北地区实行联共抗日。\n（2）经过：1936 年 12 月 12 日，张学良、杨虎城发动“兵谏”，以武力逼蒋抗日。\n（3）结果：蒋介石被迫接受停止内战、联共抗日的主张。西安事变得到和平解决。\n（4）意义：促进了中共中央联蒋抗日方针的实现。从此，十年内战的局面基本结束，全国团结抗\n战的局面初步形成。\n二、全国抗战的开始\n1、日本全面侵华：卢沟桥事变（七七事变）：1937 年 7 月 7 日晚，日军借口一名士兵失踪，要求\n搜查，遭拒后，炮轰卢沟桥，中国守军奋起还击。中国全国抗战由此开始。\n图解历史 十四年抗战\n2、中国全民族抗战：抗日民族统一战线形成\n（1）1935 年 8 月 1 日，中共发表“八一宣言” ，号召“停止内战，一致抗日”；\n（2）1935 年 12 月，中共召开瓦窑堡会议，确定建立抗日统一战线的政策；\n（3）1936 年 12 月，西安事变和平解决，标志着抗日民族统一战线初步形成；\n（4）1937 年,“七七”事变后,蒋介石发表庐山谈话,表示准备抗战。\n洛川会议：1937 年 8 月下旬，中共中央政治局在陕北洛川召开扩大会议，标志着中国共产党全\n面抗战路线的形成。\n（5）1937 年 8 月下旬，中共将所属武装改编为八路军和新四军 ，开赴抗日前线 ；\n（6）1937 年 9 月，国民党公布国共合作宣言书，标志着国共第二次合作的实现和抗日民族统一战\n线正式形成。\n三、日军的侵华暴行\n领域 暴行 概况\n军事 南京大屠杀 在南京进行持续六周的烧杀劫掠，屠杀手无寸铁中国居民和放下武器的士兵 30\n万人以上\n“三光”政策 日军在敌后抗日根据地实施野蛮的烧光、杀光、抢光“三光”政策，对抗日根\n据地进行疯狂“扫荡”。\n军事 重庆大轰炸 1938 年 2 月至 1943 年 8 月，日军对战时陪都重庆进行战略轰炸和无差别轰炸\n政治 “ 以 华 制 华 ”\n方针\n日本侵略者在占领区扶植傀儡政权。1940 年 3 月，在日本扶植下，汪精卫在南\n京成立伪国民政府。\n经济 “以战养战”方\n针\n占领区进行经济掠夺，垄断沦陷区工矿、金融、交通业;实行 “粮食统制” ，\n强行“征购”和“配给”;强迫青壮年到日本和中国东北做苦力。\n其他 细菌战 组建 731 细菌部队，进行活人试验和活人解剖等\n\n“慰安妇”制度 日军在中国强征随军性奴隶，约 20 万中国女性遭受蹂躏"}, {"title": "第23课 全民族浴血奋战与抗日战争的胜利", "body": "一、国民政府组织会战\n1、淞沪会战（1937 年 8 月至 11 月）：日军占领上海；中国军队粉碎日军“三个月亡华”狂妄企图。\n2、太原会战（1937 年 9 月至 11 月）：八路军取得平型关大捷，第一个重大胜利；忻口会战是抗战\n初期华北战场规模最大、战斗最激烈的一次战役，也是国共合作抗日的典范。11 月初，太原失守。\n3、徐州会战（1938 年 1 月至 5 月）：台儿庄大捷是抗战以来中国军队在正面战场取得的最大胜利。\n4、武汉会战（1938 年 6 月中旬至 10 月下旬）：规模最大的一次战役；武汉、广州陷落后，相持阶\n段。\n5、第三次长沙会战（1941 年 12 月开始）：歼灭大批日军，取得会战胜利，在国内外产生了积极影\n响\n二、毛泽东发表《论持久战》：1938 年武汉会战开始前发表，科学论证了中国必须通过持久作战赢\n得对日作战最后胜利的战略指导理论。增强了全国人民坚持抗战的信心和决心。\n三、工业和高校向大后方迁移\n1.表现：东部沿海工业大规模向西南大后方迁移；华北、华东各著名高校师生带着大量书籍和实验\n设备迁到西南、西北大后方。\n2.影响：鼓舞了全国人民的抗战决心，为抗战胜利奠定了物质和精神基础。\n二、敌后战场的抗战\n1.开辟敌后战场\n（1）表现：八路军、新四军建立了多个巩固的敌后抗日根据地，开展游击战争；根据地军民采取\n地道战、地雷战、夜袭战、麻雀战等战法打击日军。\n（2）影响：敌后战场的开辟，战略上配合了正面战场作战，牵制了在华日军一半以上的兵力。\n2.领导沦陷区人民进行抗战：积极开展抗日宣传领导工人斗争发动群众斗争，打击日本殖民统治\n秩序。\n3.打破日军“囚笼”，打退国民党反共高潮发动百团大战\n（1）目的：粉碎日军对敌后抗日根据地实行的“囚笼政策”\n（2）概况：1940 年 8 月至次年 1 月，八路军发动以破袭日军华北交通线为主要目标的“百团大战”\n（3）结果：打破了日军的“囚笼”。敌后战场逐渐成为全国抗战的主战场，鼓舞和增强了全国人民\n夺 4.坚持团结抗战：（1）背景：国民党消极抗战，反共倾向日益增长。1941 年 1 月，国民党顽固\n派制造了“皖南事变”；（2）对策：共产党坚持抗战、团结、进步的方针，从政治上坚决打退国民\n党的。\n5.加强根据地建设\n（1）军事：坚持敌后抗日游击战争，不断巩固和扩大抗日民主根据地。\n（2）经济：根据地实行 减租减息 政策，建设成效显著；陕甘宁边区开展大生产运动。\n（3）政治：陕甘宁边区精兵简政，以 “三三制” 为原则，开始实行“普遍、自由、直接、平等”\n的选举制度；其他敌后抗日根据地，也仿照陕甘宁边区，实行民主选举。\n三、东方主战场\n1、世界反法西斯统一战线形成\n（1）背景：1941 年 6 月 22 日，苏德战争爆发。12 月 7 日，太平洋战争爆发。中国积极倡导建立\n世界反法西斯同盟。\n（2）标志：1942 年初，以中、美、英、苏为首的 26 个同盟国家在华盛顿签署 《联合国家宣言》 。\n（3）表现：1943 年 11 月，中、美、英三国政府首脑在埃及开罗举行会议，通过《开罗宣言》，决\n定了对日作战以及战后处置日本的基本策略，规定日本所窃取的中国领土，归还中华民国。\n2.中国的贡献与影响\n（1）贡献：①太平洋战争爆发后，中国正面战场和敌后战场所抗击的日军兵力，超过了太平洋战\n场上日军的总兵力。中国战场协助和配合了盟军作战，中国实际参与了世界反法西斯战争的谋划和\n\n指挥。中国战场是世界反法西斯战争的东方主战场。②中国远征军开赴缅甸，救援英军，战绩名扬\n海外。\n（2）影响：1943 年，中国与美、英达成协议，废除不平等条约，取消在华特权，订立新的条约。\n中国与 10 余个西方国家废除旧约，签订新约。\n四、抗日战争的胜利\n1、中共七大\n（1）目的：系统地总结中国革命的基本经验，为彻底打败日本侵略者、建设新中国作准备。\n（2）概况：1945 年 4 月至 6 月，中国共产党第七次全国代表大会在延安举行。毛泽东在会上作 《论\n联合政府》 的政治报告。\n（3）内容：大会提出了党的政治路线，即放手发动群众，壮大人民力量，在中国共产党的领导下，\n打败日本侵略者，解放全国人民，建立一个新民主主义的中国。大会确立毛泽东思想为党的指导思\n想，选举产生新的中央委员会，选举毛泽东为中央委员会主席。\n（4）意义：中共七大使全党在马克思列宁主义、毛泽东思想的基础上达到了空前的团结，为中国\n共产党领导人民争取抗日战争的胜利和新民主主义革命的胜利奠定了基础。\n2.日本投降\n（1）因素：国共两党团结抗战；中国共产党始终坚持抗日民族统一战线，发挥了 中流砥柱 的作\n用；德国无条件投降；美国先后在日本广岛、长崎投下两枚原子弹；苏联对日宣战，苏军进入中国\n东北。\n（2）投降：1945 年 8 月 15 日，日本天皇发布无条件投降诏书。9 月 2 日，举行日本投降签字仪式。\n中国抗日战争和世界反法西斯战争胜利结束。\n3.台湾光复：1945 年 10 月 25 日，台湾作为中国的一个省，回到祖国怀抱。\n4.抗日战争胜利意义：（1）是近代以来中国抗击外敌入侵所取得的第一次完全胜利，对维护世界\n和平的伟大事业产生了重要影响。（2）重新确立了中国在世界上的大国地位，使中国人民赢得了世\n界爱好和平人民的尊敬。（3）开辟了中华民族伟大复兴的光明前景，开启了古老中国凤凰涅槃、浴\n火重生的新征程。"}, {"title": "第24课 人民解放战争", "body": "一、争取和平民主的斗争\n1.重庆谈判\n（1）背景：抗日战争胜利后，出现两种不同的建国方针。\n（2）中国共产党：以和平、民主、团结为号召，主张成立联合政府，力争建成一个新民主主义国\n家\n（3）国民党：打着“和平建国”的旗号，坚持独裁和内战的方针。\n（4）概况：为争取和平民主新局面，1945 年 8 月底，中共中央接受蒋介石的邀请，毛泽东、周恩\n来、王若飞等抵达重庆，进行谈判。\n（5）结果：1945 年 10 月 10 日，国共签署 “双十协定” ，协定规定：坚决避免内战，建设独立、\n自由和富强的新中国。\n2、重庆政治协商会议（1946 年 1 月 10 日）：通过了和平建国纲领案等五项协议，但是国民党六届\n二中全会否决了这些协议。\n二、全面内战的爆发\n1.全面内战爆发：1946 年 6 月，国民党以围攻中原解放区为起点，向解放区展开大规模的进攻。\n2、战略防御阶段\n（1）1946 年 6 月至 1947 年 2 月，国民党发动全面进攻；中共中央确定了自力更生、自卫战争的\n方针挫败了国民党的全面进攻。\n（2）1947 年 3 月国民党发动对陕北解放区和山东解放区的重点进攻；中共中央和解放军总部主动\n撤出延安，转战 陕北。\n\n（3）西北野战军先后取得青化砭、沙家店等战役的胜利，粉碎国民党军队对陕北解放区的重点进\n攻；华东野战军在山东孟良崮消灭国民党王牌主力整编第七十四师，打退敌人对山东解放区重点进\n攻。\n三、国民党政权的统治危机\n表现 原因 结果\n财政经济逐渐崩溃 国民政府无限制地发行纸币 国统区恶性通货膨胀，物价飞涨\n阶级矛盾扩大 国民党的反动政策和官僚资本巧取\n豪夺\n广大人民的生活水平不断下降，国民党\n在人民中的信誉一落千丈\n政治统治危机 1946 年 11 月至 12 月，国民党包办的\n“国民大会”通过了《中华民国宪法》\n进一步暴露了国民党当局坚持独裁和\n内战的真面目\n四、新民主主义革命的胜利\n1.解放区土地改革\n（1）依据：1947 年夏，全国土地会议制定了废除封建性及半封建性剥削制度的《中国土地法大纲》。\n（2）影响：各解放区掀起土地改革群众运动，使亿万农民在政治上、经济上获得了解放。\n2.战略进攻\n（1）时间：1947 年 6 月。\n（2）表现：刘伯承、邓小平率领晋冀鲁豫野战军主力，千里跃进大别山 。\n（3）影响：直接威胁到国民党统治的中心南京、武汉，揭开了战略进攻的序幕。\n三、战略决战\n1.概况\n辽沈战役 淮海战役 平津战役\n时间 1948 年 9 月至 11 月 1948 年 11 月至 1949 年 1 月 1948 年 11 月至 1949 年 1 月\n作战部队 东北野战军 华东野战军和中原野战军 东北野战军和华北军区第二、三兵团\n歼敌数 47 万余人 55 万余人 52 万余人\n战果 东北全境解放；人民解放\n军从此在数量上取得对\n国民党军队的优势\n南线国民党军队的精锐主力\n已被消灭， 长江中下游以北\n广大地区获得解放\n基本解放华北全境\n2.影响：基本摧毁了国民党的主要军事力量，为中国革命在全国的胜利奠定了基础。\n四、中共七届二中全会\n1.时间、地点：1949 年春、河北平山西柏坡。\n2.内容：（1）毛泽东在会上提出了促进革命取得全国胜利的基本方针。（2）指出党的工作重心必须\n由乡村转移到城市 。（3）提出了革命胜利后党在各方面的基本政策。（4）毛泽东提醒全党：“务必\n使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。”\n五、北平和平谈判\n1.背景：（1）三大战役后，国民党在长江以北的军事力量已全线崩溃。（2）蒋介石宣告引退，李宗\n仁代理总统职务。\n2.开启：1949 年 4 月，国共两党代表在北平举行和平谈判。\n3.结果：国民党最终拒绝在《国内和平协定》上签字，谈判破裂。\n六、渡江战役：1949 年 4 月 21 日，人民解放军发起渡江战役。23 日，人民解放军占领南京，国\n民党蒋介石集团的反动统治覆灭，中华民国时期结束。\n七、人民解放战争取得胜利的原因及意义\n1.原因 ：\n（1）国民党方面：不能解决中国社会的根本矛盾，不能应对中国社会的发展要求，不能代表广大\n民众的切身利益，从而失去了民众的支持\n（2）中国共产党方面：始终顺应时代发展的潮流，代表了中国最广大人民的根本利益，得到了广\n\n大民众的支持\n2.意义：（1）国内：中国人民革命的胜利，是马克思主义普遍原理与中国革命具体实践相结合的胜\n利，是毛泽东思想的胜利，从根本上改变了中国社会的发展方向（2）国际：中国人民革命的胜利\n是 20 世纪人类历史上最具影响的伟大事件之一。"}, {"title": "第25课 中华人民共和国成立和向社会主义的过渡", "body": "一 中华人民共和国的成立\n1、筹建：\n（1）理论基础：1949 年 6 月，毛泽东发表《论人民民主专政》\n（2）中国人民政治协商会议第一届全体会议召开\n①时间、地点：1949 年 9 月 21 日、北平。\n②内容：通过了《中国人民政治协商会议共同纲领》，规定中华人民共和国为新民主主义即人民\n民主主义国家。它是新中国建国纲领，具有临时宪法的作用。选举中央人民政府委员会，毛泽东为\n主席。\n2、标志：1949 年 10 月 1 日，中央人民政府委员会举行第一次会议，中央人民政府宣告成立。下\n午三时，举行开国大典。\n3、意义：（1）结束帝国主义、封建主义和官僚资本主义（“三座大山”）长期压迫和剥削中国各族\n人民的历史；（2）人民真正成为国家主人，从根本上改变中国社会发展方向，为实现由新民主主义\n向社会主义过渡创造前提条件；（3）中华民族开始以崭新姿态自立于世界民族之林，中国历史进入\n新纪元。\n二、人民政权的巩固\n1、肃清土匪和反革命武装：新中国刚成立时，人民解放军仍在进行人民解放战争的后期作战，肃\n清土匪和一切反革命武装。\n2、土地改革\n（1）背景：新中国刚成立时，全国尚有约占总数 2/3 的农民被束缚在封建土地制度之下。\n（2）概况：1950 年夏，中央人民政府颁布《中华人民共和国土地改革法》。到 1952 年底，除一部\n分少数民族地区外，土地改革在全国大陆基本完成。\n（3）意义：农村生产力得到大解放，为中国逐步实现工业化扫除了障碍。\n3、稳定物价\n（1）原因：国家财政困难；投机商人的行为加剧物价飞速上涨，市场混乱。\n（2）措施及结果：①进行“银元之战”和 “米棉之战” ，到 1950 年春，全国物价趋于稳定，人\n民政府赢得全国人民信任。②统一全国财政收支管理、物资管理、现金管理等，实现国家财政经济\n统一。\n（3）影响：到 1952 年底，中华人民共和国成立前遭到严重破坏的国民经济得到全面恢复。\n四、抗美援朝\n1、背景：1950 年 6 月 25 日，朝鲜内战爆发；美国武装干涉朝鲜内战，威胁中国国家安全。\n2、经过：（1）1950 年 10 月，中国人民志愿军开赴朝鲜战场，抗美援朝，保家卫国。（2）1953 年\n7 月，美国不得不在停战协定上签字。中国人民取得抗美援朝战争的伟大胜利。\n3、影响：（1）打出了国威和军威，提高了新中国的国际地位。（2）志愿军的英雄事迹汇成强大民\n族凝聚力，锻造伟大抗美援朝精神，极大地鼓舞着全国人民为保卫和建设祖国而团结奋斗。（3）是\n中国人民站起来后屹立于世界东方的宣言书，是中华民族走向伟大复的重要里程碑。\n三、开创独立自主的和平外交\n1.外交方针:新中国奉行 独立自主 的和平外交方针，具体表现为：“一边倒”“另起炉灶”“打扫\n干净屋子再请客”。\n2.重要外交活动与成就\n（1）建交高潮：与苏联、印度等众多国家建交，迎来一次建交高潮。新中国取消帝国主义在中国\n的特权。\n\n（2）日内瓦会议：1954 年，讨论朝鲜问题和印度支那问题，显示了新中国通过谈判解决国际争端，\n维护世界和平方面所起的积极作用。\n（3）和平共处五项原则：1953 年 12 月，印度代表团时首次提出和平共处五项原则；1954 年 6 月，\n中印、中缅双方总理在联合声明中，正式倡议将和平共处五项原则作为国际关系的准则。最终确定\n为互相尊重主权和领土完整，互不侵犯，互不干涉内政，平等互利，和平共处。\n（4）亚非会议：1955 年、印度尼西亚万隆。战后第一次没有西方殖民国家参加的国际会议。中国\n提出并坚持 “求同存异” 的方针，推动会议朝着达成协议的方向前进。为进一步开展同亚非各国\n的友好合作关系创造了条件。亚非会议后，中国独立自主的和平外交取得了新进展。\n四、社会主义基本制度的建立\n1.提出过渡时期总路线\n（1）时间：1953 年。\n（2）内容：实施第一个五年计划，逐步实现国家的社会主义工业化，并逐步实现国家对农业、手\n工业和资本主义工商的社会主义改造。\n2.进行社会主义改造\n（1）概况：1956 年底，我国基本上完成了对农业、手工业和资本主义工商业的社会主义改造。\n（2）意义：标志着生产资料公有制占绝对优势的社会主义经济制度在我国初步建立起来。\n3.进行社会主义工业化建设：经过有计划的社会主义经济建设，第一个五年计划提前完成，我国\n开始改变工业落后的面貌。\n4.第一届全国人民代表大会第一次会议\n（1）时间、地点：1954 年 9 月、北京。（2）内容：通过了《中华人民共和国宪法》，这是一部社\n会主义类型的宪法，体现了人民民主原则和社会主义原则。\n5.初步构建社会主义政治制度体系：人民代表大会制度是根本政治制度，中国共产党领导的多党\n合作和政治协商制度、民族区域自治制度是基本政治制度。\n6.社会主义基本制度建立的意义：中国共产党团结带领人民完成社会主义革命，确立社会主义基\n本制度，推进社会主义建设，实现了中华民族有史以来最为广泛而深刻的社会变革，为当代中国一\n切发展进步奠定了根本政治前提和制度基础。\n五、指导思想：毛泽东思想不仅是新民主主义革命的指导思想，也是社会主义革命、社会主义建\n设的指导思想。"}, {"title": "第26课 社会主义建设在探索中曲折发展", "body": "一、全面建设社会主义\n1.中共八大（1956 年）\n（1）国内的主要矛盾：人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾；人\n民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。\n（2）主要任务：集中力量解决主要矛盾，把我国尽快地从落后的农业国变为先进的工业国。\n（3）意义：我国建设社会主义道路的一次成功探索。\n2.“双百”方针（1956 年）\n（1）内容：艺术问题上百花齐放，学术问题上百家争鸣。\n（2）作用：成为我国促进艺术发展和科学进步，促进社会主义文化繁荣的指导方针。\n\n3.提出关于正确处理人民内部矛盾的重要思想（1957 年春）\n（1）内容：把正确处理人民内部矛盾作为国家政治生活的主题。\n（2）意义：为认识中国基本国情奠定了理论基础。\n4.探索中的失误\n（1）表现：1958 年，中共中央提出“鼓足干劲、力争上游、多快好省地建设社会主义”的总路线。\n在全国掀起了“大跃进”和人民公社化运动。\n（2）评价：总路线反映了广大人民迫切要求改变我国经济文化落后状况的普遍愿望，但由于片面\n追求经济建设高速度，忽视了客观的经济规律。加上对社会主义建设经验不足，以及当时的自然灾\n害等因素，1959—1961 年，我国经济发生了严重困难。\n5.政策调整\n（1）内容：\n①八字方针：从 1960 年冬开始，中共中央对国民经济实行“调整、巩固、充实、提高”的方针（八\n字方针）。对政治、文化、教育、科研、民族、知识分子等方面的政策进行调整。\n②七千人大会（1962 年）：比较系统总结了“大跃进”以来经济建设工作的基本经验和教训。\n③1964 年，三届全国人大一次会议提出建设“四个现代化”的伟大目标。\n（3）意义：1962 年下半年到 1965 年，国民经济稳步增长，接近并超过新中国成立以来最高水平。\n二、“文化大革命”\n1.原因\n（1）20 世纪 60 年代中期，毛泽东认为党和国家面临着资本主义复辟的现实危险。\n（2）毛泽东强调“以阶级斗争为纲”，想通过发动“文化大革命”来防止资本主义复辟。\n2.主要经过：\n（1）导火线：1965 年 11 月，姚文元批判《海瑞罢官》。\n（2）正式发动：1966 年 5 月， “五一六通知”成立中央文革小组；陈伯达、江青、康生、张春\n桥组成的中央文革小组趁机煽动“打倒一切”和“踢开党委闹革命”。1966 年 8 月，八届十一中全\n会，通过《中共中央关于无产阶级文化大革命的决定》，毛泽东在天安门城楼首次接见“红卫兵”。\n（3）夺权：\n①“一月风暴”：“全面夺权”的“一月风暴”发生，许多地方出现造反派打砸抢事件，社会和生产\n秩序陷入混乱；党政机关瘫痪；\n②1968 年，毛泽东发出“知识青年到农村去，接受贫下中农的再教育，很有必要”的号召；\n③1969 年 4 月，中共九大之后，全国范围内普遍开展了“斗（争）、批（判）、改（革）”运动。\n④1971 年，林彪反革命集团策动武装政变，阴谋夺取最高权力。毛泽东、周恩来粉碎了这次政变。\n3.性质：一场由领导者错误发动，被反革命集团利用，给党、国家和各族人民带来严重灾难的内乱。\n三、伟大的建设成就时代精神\n1.工业：逐步建成一批门类比较齐全基础工业项目，为国民经济的进一步发展打下坚实基础，建立\n起独立的、比较完整的工业体系和国民经济体系.；大规模的三线建设不仅增强了国防力量，而且\n改善了工业布局。\n2.国防科技：成功地爆炸了原子弹、氢弹，试制并成功发射了中远程弹道导弹和人造卫星。\n3.农业：通过兴修水利、开展农田基本建设、培育推广良种、提倡科学种田，较大幅度地提高粮食\n生产水平和抵御自然灾害的能力。\n4.文教卫生：教育事业取得长足进步，医疗卫生事业也得到蓬勃发展。\n5.外交：20 世纪 70 年代，中国外交打开新局面，迎来了新中国成立以来与世界各国建交的又一次\n高潮。1971 年，中华人民共和国恢复在联合国的一切合法权利。1972 年，中美开始走向关系正常\n化；中日正式建交。\n6.英雄楷模和时代精神\n（1）英雄楷模：“铁人”王进喜、党的好干部焦裕禄、解放军好战士雷锋等；知识分子中的杰出代\n表有李四光、钱学森、邓稼先、华罗庚等。\n（2）时代精神：自力更生、 艰苦奋斗 。\n\n7.历史意义：这些成就在新中国历史上都具有开创性、奠基性的意义，为新的历史时期开创中国\n特色社会主义道路提供了宝贵经验、理论准备、物质基础。"}, {"title": "第27课 中国特色社会主义的开创与发展", "body": "一、伟大的历史转折\n1.中共十一届三中全会\n（1）背景：1978 年 5 月，真理标准问题的讨论重新确立了实事求是的马克思主义思想路线，为历\n史性转折作了重要的思想理论准备。\n（2）召开：1978 年 12 月，在北京召开。\n（3）内容：①指导思想：邓小平《解放思想，实事求是，团结一致向前看》的重要讲话。②着重\n点转移：停止使用“以阶级斗争为纲”的错误口号，作出把全党工作着重点转移到社会主义现代化\n建设上来、实行改革开放的历史性决策。③重新确立了党的思想路线、政治路线和组织路线，恢复\n了党的民主集中制的优良传统。④审查解决了历史上遗留的一批重大问题和一些重要领导人的功过\n是非问题。\n4.意义：实现了新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义\n现代化建设新时期。\n二、民主法制建设\n1.平反冤假错案\n（1）原则：实事求是和有错必纠。\n（2）表现：①“文化大革命”中受到迫害的各级党、政、军干部陆续得到平反，受到打击、诬陷\n或迫害的民主党派人士和知识分子等也恢复了名誉。②改正了错划右派分子的案件，落实各项政策。\n2.中共十一届六中全会\n（1）时间：1981 年 6 月。\n（2）内容：审议和通过了《关于建国以来党的若干历史问题的决议》。\n（3）意义：科学总结了新中国成立以来社会主义革命和建设的历史经验，对统一全党思想，开展\n改革开放新的伟大革命，打下了重要的思想基础。\n3.1982 年宪法：1982 年底，五届全国人大五次会议通过新修改《中华人民共和国宪法》。这部宪\n法增加适应改革开放和社会主义现代化建设的新规定，标志着我国社会主义民主政治建设进入新的\n阶段。\n二、改革开放进程\n1.对内改革\n（1）农村突破：家庭联产承包责任制在全国推广开来，促进了农业发展,提高了农民收入。\n（2）城市推进：城市经济体制改革以扩大企业自主权为主要内容进行试点；1984 年，城市改革全\n面展开，国营企业广泛推行承包经营责任制，个体经济、私营经济和外商投资企业也发展起来。\n2.对外开放：1980 年，党和国家决定在深圳、珠海、汕头、厦门设立经济特区。我国还相继开放\n沿海港口城市、沿海经济开放区，建立海南经济特区、上海浦东新区。\n3.深化与扩大\n中共十二大（1982 年）邓小平提出建设有中国特色的社会主义重大命题，对全面开展社会主义\n现代化建设作出部署\n中共十三大（1987 年）提出社会主义初级阶段理论，确立“以经济建设为中心，坚持四项基本\n原则，坚持改革开放”的基本路线，制定了“三步走”现代化发展战略\n邓小平发表南方谈话\n（1992 年）\n深刻阐述了社会主义的本质、计划和市场的关系等重大问题，强调党的\n基本路线要管一百年，动揺不得。邓小平的南方谈话，对加快推进改革\n开放产生深远影响。\n\n中共十四大（1992 年）大会号召抓住机遇，加快发展，集中精力把经济建设搞上去，明确我国\n经济体制改革的目标是建立社会主义市场经济体制。随后，我国按照建\n立现代企业制度的总体思路推进国有企业改革\n中共十五大（1997 年）提出党在社会主义初级阶段的基本纲领，明确公有制为主体、多种所有\n制经济共冋发展是我国社会主义初级阶段的一项基本经济制度\n2001 年 我国加入世界贸易组织，更深层次地参与经济全球化进程\n中共十六大（2002 年）明确了全面建设小康社会的奋斗目标\n中共十七大（2007 年）阐述了中国特色社会主义道路的基本内涵\n其他 中央还提出并实施了科教兴国、可持续发展、西部大开发、“引进来”\n和“走出去”相结合等重大战略，有力推动了中国特色社会主义事业的\n跨世纪发展\n三、中国特色社会主义理论体系的概括提出\n理论 解决问题 地位、意义\n邓小平理论：1978 年中\n共十一届三中全会以后\n阐明了在中国建设社会主\n义、巩固和发展社会主义\n的基本问题\n成功开创了中国特色社会主义。在 1997 年\n中共十五大上，邓小平理论被写入党章，\n并被确立为党的指导思想\n“三个代表”重要思想：\n1989 年中共十三届四中\n全会以后\n加 深 了 对 什 么 是 社 会 主\n义、怎样建设社会主义和\n建设什么样的党、怎样建\n设党的认识\n开创全面改革开放新局面，成功把中国特\n色社会主义推向 21 世纪。在 2002 年中共\n十六大上，“三个代表”重要思想被写入党\n章，并被确立为党的指导思想\n科学发展观：2002 年中\n共十六大以后\n深刻认识和回答了新形势\n下实现什么样的发展、怎\n样发展等重大问题，形成\n了以人为本、全面协调可\n持续发展的科学发展观\n着力保障和改善民生，促进社会公平正义，\n成功在新形势下坚持和发展中国特色社会\n主义。在 2007 年中共十七大上，科学发展\n观被写入党章，在 2012 年中共十八大上被\n确立为党的指导思想"}, {"title": "第28课 改革开放和社会主义现代化建设的巨大成就", "body": "一、综合国力不断提升\n1.20 世纪 80 年代后期\n（1）1984 年至 1988 年，国家经济实力和综合国力迈上了一个新台阶。\n（2）1990 年，“七五”计划所规定的国民经济和社会发展各项指标绝大部分完成或超额完成，提\n前实现了第一步战略目标。\n（3）人民生活水平进一步提高，全国绝大多数地区解决了温饱问题，开始向小康社会迈进。\n（4）国家在科学技术多个领域取得新成就：1983 年研制成功的“银河-Ⅰ”巨型计算机，填补了\n国内巨型计算机研制的空白； 1988 年，我国第一座高能加速器——北京正负电子对撞机对撞成功；\n1991 年，我国自行设计、自行建造的核电站——秦山核电站并网发电。\n2.20 世纪 90 年代\n（1）取得应对亚洲金融危机和一系列重大斗争的胜利。（2）2000 年“九五”计划的主要任务完成\n\n或超额完成；人均国内生产总值比 1980 年翻两番的目标在 1997 年提前完成;主要工农业产品产量\n位居世界前列，商品短缺状况基本结束。（3）城乡居民收入大幅度增加，生活质量显著提升。人民\n生活总体上达到小康水平。（4）科技事业取得巨大成就。\n3.21 世纪\n（1）国家战胜非典疫情，夺取汶川抗震救灾胜利，成功应对国际金融危机。（2）国民经济保持较\n快增长。2010 年，经济总量跃升至世界第二位。（3）2006 年，国家取消农业税，并出台强农惠农\n富农政策，粮食产量连续增长。（4）人民生活明显改善，城镇居民人均可支配收入和农村居民人均\n纯收入年均较快增长。全民医疗保障体系初步形成，最低生活保障制度实现全覆盖，城乡社会救助\n体系基本建立。（5）重要学科前沿和战略必争领域取得一批重大自主创新成果，2011 年，我国已\n成为世界第一电子信息产品制造大国，计算机等电子产品产量居世界第一位，互联网网民数量居世\n界第一位。\n二、“一国两制”与祖国统一大业\n1、“一国两制”构想\n（1）提出：20 世纪 80 年代初，针对台湾问题，邓小平提出“一个国家，两种制度”的构想。\n（2）内涵：在一个中国的前提下，国家的主体坚持社会主义制度，香港、澳门、台湾保持原有的\n资本主义制度长期不变。\n2.香港、澳门回归与发展\n（1）回归过程：①1984 年 12 月和 1987 年 4 月，分别签署了中英、中葡联合声明。②1997 年 7\n月 1 日，中国对香港恢复行使主权。③1999 年 12 月 20 日，中国对澳门恢复行使主权。\n（2）回归意义：香港、澳门的回归，标志着祖国统一大业向前迈出重要一步。\n3.香港、澳门的发展\n（1）香港、澳门回归后，中央政府严格按照宪法和特别行政区基本法办事，全力支持特别行政区\n政府依法施政、发展经济、改善民生，取得显著成绩。\n（2）2003 年，中央政府与香港、澳门特别行政区政府签署关于内地与香港、澳门建立更紧密经贸\n关系的安排及其补充协议，促进内地与港澳之间的货物、服务贸易自由化和投资便利化，实现了港\n澳与内地优势互补、共同发展。\n（3）开放内地部分城市居民个人赴港澳旅游，扩大人民币在香港、澳门业务，推动内地企业在香\n港上市。香港、澳门地区生产总值实现大幅增长，社会保持稳定，经济更加繁荣，显示了“一国两\n制”方针的强大生命力。\n三、海峡两岸的交流\n1.关系缓和：1979 年元旦全国人大常委会发表《告台湾同胞书》后，中国政府推动大陆同台湾同\n胞的经济技术交流与合作，促进双方人员往来。\n2.“九二共识”：1992 年 11 月，大陆海峡两岸关系协会与台湾海峡交流基金会，就解决两岸事务\n性商谈中如何表述坚持一个中国原则的问题，达成“海峡两岸同属一个中国，共同努力谋求国家统\n一”的共识，后被称为“九二共识”。\n3.汪辜会谈：1993 年 4 月，汪辜会谈标志着两岸关系发展迈出了重要一步。经过海峡两岸同胞的\n共同努力，两岸往来日渐频繁，民间交往不断扩大，经贸合作蓬勃发展。\n4.《反分裂国家法》：进入 21 世纪，“台独”分裂活动不断加剧，2005 年 3 月 14 日，十届全国人\n大三次会议通过《反分裂国家法》，表明全中国人民维护国家主权和领土完整的共同意志和坚定决\n心。\n5.连战访问大陆：2005 年 4 月，胡锦涛邀请中国国民党主席连战访问大陆，成功开启两岸政党交\n流。双方达成坚持“九二共识”、反对“台独”、谋求台海和平稳定、促进两岸关系发展等多项共识。\n6.两岸“三通”：2008 年 12 月，两岸海、空直航及直接通邮正式启动，两岸全面直接双向通邮、\n通商、通航的“三通”迈开实质性步伐。大陆方面还实施多项对台惠民政策措施，两岸在学术、文\n化、教育、体育等方面的交流交往不断深化。\n三、国际影响力不断扩大\n1.基本主张\n\n（1）邓小平明确提出“和平和发展”是当代世界的两大问题”的论断，主张世界上所有国家不论\n大小、富贫、强弱一律平等;中国决不称霸，也坚决反对任何霸权主义。\n（2）中国始终坚持独立自主，对一切国际问题都根据其本身的是非曲直决定自己的态度和对策，\n坚决反对任何国家以社会制度和意识形态为借口，占领别国领土、干涉别国内政。\n2.对外关系的发展\n（1）1978 年 8 月，中国同日本签订《中日和平友好条约》。1979 年 1 月，中美两国正式建交。1989\n年，中苏两国实现关系正常化。到 1992 年，同中国建交的国家达 154 个。\n（2）20 世纪 90 年代，我国积极发展新型大国关系，分别同俄罗斯、美国、法国、英国、日本及\n欧盟等建立了发展面向 21 世纪双边关系的基本框架。\n（3）中国积极发展同周边国家和地区的睦邻友好关系，倡导并推动建立“中国—东盟自由贸易区”，\n成立上海合作组织。\n（4）中国以更加开放的姿态积极参与以联合国为中心的多边外交活动。\n（8）2001 年，中国在上海成功举办亚太经合组织第九次领导人非正式会议，为促进亚太地区经济\n的恢复和发展产生积极影响。\n（9）世纪之交，我国建立起全方位多层次的对外关系新格局，国际影响力显著提高。\n3.21 世纪，我国始终不渝走和平发展道路，致力于维护世界和平，促进各国共同发展\n（1）中美关系总体稳定，中俄关系高水平发展，周边关系取得突破。\n（2）2002 年 11 月，中国同东盟国家签署《南海各方行为宣言》，为相关国家在南海开展务实合作\n奠定了政治基础。\n（3）2003 年，中国与欧盟确定建立全面战略伙伴关系，双方经贸合作迅速发展。\n（4）2008 年，国际金融危机爆发后，中国致力于推动全球经济治理体系改革。\n（5）从 2009 年开始，中国和其他金砖国家领导人建立定期会晤机制，增强了新兴市场国家和发展\n中国家在全球治理中的代表性和发言权。\n（6）中国还积极参与安全与反恐等全球性问题的国际合作，充分展示负责任大国的形象。"}, {"title": "第29课 中国特色社会主义进入新时代", "body": "一、中共十八大（2012 年）\n1.主线：坚持和发展中国特色社会主义\n2.重要报告：胡锦涛作题为《坚定不移沿着中国特色社会主义道路前进，为全面建成小康社会而\n奋斗》的报告\n3.主要内容 ：大会强调：中国特色社会主义道路、中国特色社会主义理论体系、中国特色社会主\n义制度，是党和人民 90 多年奋斗、创造、积累的根本成就，必须倍加珍惜、始终坚持、不断发展。\n建设中国特色社会主义，总依据是社会主义初级阶段，总布局是“五位一体”，总任务是实现社会\n主义现代化和中华民族伟大复兴。大会提出，在中国共产党成立 100 年时全面建成小康社会，在新\n中国成立 100 年时建成富强民主文明和谐的社会主义现代化国家。大会根据我国经济社会发展实际，\n确定全面建成小康社会的目标\n二、习近平对中国梦的阐释\n1.中国梦的本质：实现中华民族伟大复兴的中国梦，就是要实现国家富强、民族振兴、人民幸福。\n2.实现中国梦的道路：必须走中国道路，这就是中国特色社会主义道路;必须弘扬中国精神，这就\n是以爱国主义为核心的民族精神和以改革创新为核心的时代精神;必须凝聚中国力量，这就是中国\n各族人民大团结的力量。\n3.中国梦的地位：中国梦是国家的梦、民族的梦，也是每一个中华儿女的梦。\n三、中共十九大和习近平新时代中国特色社会主义思想\n1.中共十九大（2017 年）\n（1）重要报告：习近平作题为《决胜全面建成小康社会，夺取新时代中国特色社会主义伟大胜利》\n的报告\n（2）主题：不忘初心，牢记使命，高举中国特色社会主义伟大旗帜，决胜全面建成小康社会，夺\n\n取新时代中国特色社会主义伟大胜利，为实现中华民族伟大复兴的中国梦不懈奋斗\n（3）主要内容：①提出我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充\n分的发展之间的矛盾。②确定决胜全面建成小康社会、开启全面建设社会主义现代化国家新征程的\n目标，对实现第二个百年奋斗目标作出分两个阶段推进的战略安排\n（4）确立习近平新时代中国特色社会主义思想为党的指导思想，并写入党章。\n2、十三届全国人大一次会议（2018 年）：通过《中华人民共和国宪法修正案》，把习近平新时代中\n国特色社会主义思想载入宪法。\n3、习近平新时代中国特色社会主义思想\n（1）主要内容：习近平对关系新时代党和国家事业发展的一系列重大理论和实践问题进行了深邃\n思考和科学判断，就重大时代课题提出一系列原创性的治国理政新理念新思想新战略。\n（2）历史地位：习近平新时代中国特色社会主义思想是当代中国马克思主义、21 世纪马克思主义，\n是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。\n4.中共十九届六中全会（2021 年）：通过《中共中央关于党的百年奋斗重大成就和历史经验的决议》。\n《决议》科学总结了党的百年奋斗重大成就和历史经验，明确提出确立习近平党中央的核心、全党\n的核心地位，确立习近平新时代中国特色社会主义思想的指导地位，反映了全党全军全国各族人民\n共同心愿，对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。\n三、中共二十大与全面建设社会主义现代化国家新征程\n1.中共二十大（2022 年）\n（1）重要报告：习近平作题为《高举中国特色社会主义伟大旗帜，为全面建设社会主义现代化国\n家而团结奋斗》的报告。\n（2）主要内容：\n①大会主题：高举中国特色社会主义伟大旗帜，全面贯彻习近平新时代中国特色社会主义思想，弘\n扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会主义现代化国家、\n全面推进中华民族伟大复兴而团结奋斗。\n②三件大事：大会强调，中共十八大召开十年来，我们经历了对党和人民事业具有重大现实意义和\n深远历史意义的三件大事，即迎来中国共产党成立 100 周年；中国特色社会主义进入新时代;完成\n脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。\n③中心任务：大会提出新时代新征程中国共产党的中心任务就是团结带领全国各族人民全面建成社\n会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"}, {"title": "第30课 新时代中国特色社会主义的伟大成就", "body": "一、全面建成小康社会\n1.全面小康的内涵：2015 年 10 月，习近平在中共十八届五中全会上强调“小康”讲的是发展水平，\n“全面”讲的是发展的平衡性、协调性、可持续性。\n2.绝对贫困的消除\n（1）2013 年，习近平提出了“精准扶贫”理念。（2）2020 年 11 月，我国最后九个贫困县实现贫\n困退出，这标志着我国在实现共同富裕的道路上迈出了坚实的一大步。（3）2021 年 2 月，在全国\n脱贫攻坚总结表彰大会上，习近平庄严宣告:我国完成了消除绝对贫困的艰巨任务。\n（2）意义：脱贫攻坚伟大斗争，锻造形成了脱贫攻坚精神；我国提前十年实现联合国 2030 年可持\n续发展议程减贫目标，为全球减贫事业作出重大贡献。\n3.全面建成小康社会的意义\n（1）我国实现了第一个百年奋斗目标，书写了经济快速发展和社会长期稳定两大奇迹新篇章，正\n在意气风发向着全面建成社会主义现代化强国的第二个百年奋斗目标迈进。（2）我国发展具备了更\n为坚实的物质基础、更为完善的制度保证，实现中华民族伟大复兴进入了不可逆转的历史进程。\n二、综合国力显著提升\n1.经济实力的跃升：（1）经济总量稳居世界第二位；（2）人均国内生产总值接近高收入国家门槛\n（3）制造业规模、外汇储备、谷物总产量稳居世界第一位；（4）基础设施建设在众多领域走在世\n\n界前列。\n2.科技的进步：（1）国家加快推进科技自立自强（2）基础研究和原始创新不断加强，我国进入创\n新型国家行列。\n3.人民生活全方位改善 ：（1）居民人均预期寿命和人均可支配收入都有明显提升；（2）建成世界\n上规模最大的教育体系，教育普及水平实现历史性跨越；（3）建成世界规模最大的社会保障体系和\n医疗卫生体系，共同富裕取得新成效。\n4.国防实力的提升：（1）国防和军队改革取得历史性突破，重构人民军队领导指挥体制、现代军\n事力量体系和军事政策制度，全面推进国防科技创新。（2）我军现代化水平和实战能力显著提升。\n三、在应对风险挑战中推进各项事业\n1.捍卫自由贸易和多边体制\n（1）背景：2018 年以来，我国外部形势发生深刻复杂变化，特别是美国单方面执意挑起中美经贸\n摩擦，对我国进行遏制打压，给我国经济运行带来不利影响。\n（2）应对：面对国际上保护主义的抬头、单边霸凌的逆流，我国采取有力反制措施，坚决捍卫自\n身合法利益，捍卫自由贸易和多边体制，坚定地站在历史前进的正确一边。\n2.推进香港、澳门发展\n（1）背景：2019 年 6 月，香港爆发“修例风波”，充分暴露出香港在维护国家安全方面存在的制\n度漏洞。中央政府坚定支持香港特别行政区依法打击和惩治暴力犯罪活动，止暴制乱，恢复秩序。\n（2）表现：2020 年 6 月，十三届全国人大常委会第二十次会议通过《中华人民共和国香港特别行\n政区维护国家安全法》，并将该法列入香港基本法附件三，明确由香港特别行政区在当地公布实施，\n对香港特别行政区维护国家安全制度机制作出法律化、规范化、明晰化的具体安排。\n（3）意义：这一重大举措，全面贯彻“爱国者治港”原则，推动香港局势实现由乱到治的重大转\n折。国家深入推进粤港澳大湾区建设，支持香港、澳门发展经济、改善民生，香港、澳门保持了长\n期稳定发展良好态势。\n三、解决台湾问题、实现祖国完全统一，是实现中华民族伟大复兴的必然要求\n1.2015 年 11 月 7 日，两岸领导人习近平、马英九在新加坡会面，就进一步推进两岸关系和平发展\n交换意见。这是 1949 年以来两岸领导人的首次会面，翻开了两岸关系历史性一页。\n2.在中国共产党的引领推动下，两岸交流合作日益广泛。有关部门出台一系列政策措施，为台湾同\n胞来大陆学习、创业、就业、生活提供同等待遇，分享大陆发展机遇。\n3.中共十九大鲜明地提出，绝不允许任何人、任何组织、任何政党、在任何时候，以任何形式、把\n任何一块中国领土从中国分裂出去。我们开展了反分裂、反干涉重大斗争，牢牢把握两岸关系主导\n权和主动权。中共二十大重申新时代党解决台湾问题的总体方略，强调解决台湾问题是中国人自己\n的事，要由中国人来决定。\n四、抗击疫情\n1.疫情的暴发：2020 年初，一场突如其来的新冠疫情暴发，成为新中国成立以来遭遇的传播速度\n最快、感染范围最广、防控难度最大的一次重大突发公共卫生事件\n2.抗击疫情：以习近平同志为核心的党中央坚持人民至上、生命至上，坚持科学精准防控，因时因\n势优化调整防控措施，最大限度保护了人民生命安全和身体健康，统筹疫情防控和经济社会发展取\n得重大积极成果，铸就了伟大抗疫精神。\n四、中国特色大国外交和推动构建人类命运共同体\n1、中国特色大国外交的战略思想\n（1）背景：21 世纪的第二个十年，世界处于大发展大变革大调整之中。\n（2）内涵：高举和平、发展、合作、共赢的旗帜，牢牢把握坚持和平发展、促进民族复兴这条主\n线，为实现“两个一百年”奋斗目标、实现中华民族伟大复兴的中国梦提供有力保障。\n2.构建人类命运共同体\n（1）提出：2013 年 3 月，习近平在莫斯科国际关系学院首次提出\n（2）发展：2015 年 9 月，习近平在联合国大会的演讲，全面阐述人类命运共同体内涵，呼吁构建\n以 合作共赢为核心的新型国际关系，打造人类命运共同体。\n\n（3）意义：人类命运共同体理念得到国际社会广泛认同，被写入联合国安理会决议，为解决人类\n面临的各种复杂问题贡献了中国智慧和中国方案。\n3.坚定奉行独立自主的和平外交政策：走和平发展道路，反对一切霸权主义和强权政治，以及任\n何单边主义、保护主义、霸凌行径。中国提出全球发展倡议、全球安全倡议、全球文明倡议，倡导\n和平、发展、公平、正义、民主、自由的全人类共同价值，致力于携手建设持久和平、普遍安全、\n共同繁荣、开放包容、清洁美丽的世界。\n4.积极参与全球治理体系的改革和建设\n（1）践行共商共建共享的全球治理观，坚持真正的多边主义。\n（2）坚定维护以联合国为核心的国际体系、以国际法为基础的国际秩序、以联合国宪章宗旨和原\n则为基础的国际关系基本准则。\n（3）推动地区热点问题的政治解决，积极开展南南合作，增强新兴市场国家和发展中国家在全球\n事务中的代表性和发言权，为维护世界和平和地区稳定发挥建设性作用，展现负责任大国担当。\n5.坚定奉行互利共赢的开放战略\n（1）中国的“一带一路”倡议成为深受欢迎的国际公共产品和国际合作平台。\n（2）截至 2023 年 1 月，累计已经同 150 多个国家签署合作文件。\n（3）中国是 140 多个国家和地区的主要贸易伙伴，货物贸易总额居世界第一位。\n（4）中国更高水平的对外开放为世界提供新机遇，更好惠及各国人民。"}];

// 加载题目池
let roundSize = 0;
function loadQuestionBank(mode="normal"){
  const selVal = document.getElementById("sel-group").value;
  if(mode === "shengshu"){
    qBank = questionList.filter(q=>store.shengshuList.includes(q.title));
  }else if(mode === "cuoti"){
    qBank = questionList.filter(q=>store.cuotiList.includes(q.title));
  }else{
    qBank = questionList.filter(q=>q.type === currentTab && q.group === selVal);
  }
  qIndex = 0;
  sourceMode = mode;
  if(qBank.length ===0){
    document.getElementById("cardBox").innerHTML = `<div class="empty-tip">该分类下暂无题目</div>`;
    document.getElementById("bottomBtnWrap").style.display="none";
    return false;
  }
  roundSize = qBank.length;
  shuffle(qBank);
  renderQ();
  return true;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}
function renderQ(){
  currentQ = qBank[qIndex];
  document.getElementById("btn-prev").disabled = qIndex === 0;
  let html = `<div class="question-title">${currentQ.title}</div>`;
  currentQ.opts.forEach(opt=>{
    html += `<div class="opt" data-label="${opt.label}" data-ans="${currentQ.ans}">
      ${opt.label}. ${opt.text}
      <div class="opt-exp">${opt.exp}</div>
    </div>`
  })
  document.getElementById("cardBox").innerHTML = html;
  document.getElementById("bottomBtnWrap").style.display="flex";
  // 选项点击
  document.querySelectorAll(".opt").forEach(opt=>{
    opt.onclick = function(){
      document.querySelectorAll(".opt").forEach(o=>{
        o.classList.remove("right","wrong","show-exp");
        if(o.dataset.label === currentQ.ans) o.classList.add("right");
      })
      if(this.dataset.label !== currentQ.ans){
        this.classList.add("wrong");
        // 答错，加入错题本
        if(!store.cuotiList.includes(currentQ.title)){
          store.cuotiList.push(currentQ.title);
        }
      }
      document.querySelectorAll(".opt").forEach(o=>o.classList.add("show-exp"));
      store.total +=1;
      if(this.dataset.label === currentQ.ans) store.right +=1;
      saveStore();
      updateStatPanel();
    }
  })
}

// 按钮事件
document.getElementById("btn-start").onclick = ()=>loadQuestionBank("normal");
document.getElementById("btn-shengshu").onclick = ()=>loadQuestionBank("shengshu");
document.getElementById("btn-cuotiben").onclick = ()=>loadQuestionBank("cuoti");
document.getElementById("btn-prev").onclick = ()=>{
  if(qIndex <= 0) return;
  qIndex--;
  renderQ();
}
document.getElementById("btn-next").onclick = ()=>{
  if(!qBank.length) return;
  qIndex++;
  if(qIndex >= qBank.length){
    const nextRound = qBank.slice(-roundSize);
    shuffle(nextRound);
    qBank.push(...nextRound);
  }
  renderQ();
}
document.getElementById("btn-mark-shuxi").onclick = ()=>{
  if(!currentQ) return;
  store.shengshuList = store.shengshuList.filter(t=>t!==currentQ.title);
  saveStore();
  updateStatPanel();
}
document.getElementById("btn-mark-shengshu").onclick = ()=>{
  if(!currentQ) return;
  if(!store.shengshuList.includes(currentQ.title)) store.shengshuList.push(currentQ.title);
  saveStore();
  updateStatPanel();
}

// 统计弹窗
function updateStatPanel(){
  const total = store.total;
  const right = store.right;
  const rate = total>0 ? Math.round(right/total*100)+"%" : "0%";
  document.getElementById("stat-total").innerText = total;
  document.getElementById("stat-right").innerText = right;
  document.getElementById("stat-rate").innerText = rate;
  document.getElementById("stat-sc").innerText = store.shengshuList.length;
  document.getElementById("stat-cuo").innerText = store.cuotiList.length;
}
document.getElementById("btn-stat").onclick = ()=>{
  updateStatPanel();
  document.getElementById("statPopup").classList.add("show");
}
document.getElementById("statClose").onclick = ()=>{
  document.getElementById("statPopup").classList.remove("show");
}
document.getElementById("btn-clear").onclick = ()=>{
  if(confirm("确定清空所有做题记录？错题本、生疏本都会清空！")){
    store = {total:0,right:0,shengshuList:[],cuotiList:[]};
    saveStore();
    updateStatPanel();
  }
}
function saveStore(){
  localStorage.setItem("bblsHistory",JSON.stringify(store));
}
updateStatPanel();
</script>
</body>
</html>
